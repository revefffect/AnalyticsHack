<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112b2a">
  <title>Метеоархив · AnalyticsHack</title>
  <style>
:root {
  color-scheme: light;
  --canvas: #eff3ec; --card: #fcfdf9; --ink: #152c29; --muted: #526761;
  --line: #d8e1d7; --green: #23634f; --dark: #122d2b; --accent: #bce3a7;
  font: 15px/1.55 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; margin: 0; background: var(--canvas); color: var(--ink); }
.sidebar { background: var(--dark); color: #ecf6e9; padding: 32px 19px 24px; min-height: 100vh; display: flex; flex-direction: column; gap: 43px; }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 750; font-size: 18px; }
.brand-icon { background: var(--accent); color: var(--dark); font-size: 24px; border-radius: 12px; padding: 0 9px; }
.brand small { display: block; color: #b3c4b9; font-size: 11px; font-weight: 500; letter-spacing: .11em; }
nav { display: grid; gap: 7px; }
nav button { text-align: left; color: #d4e3da; background: transparent; border-color: transparent; }
nav button[aria-current="page"], nav button:hover { background: #284840; color: #fff; }
.identity { margin-top: auto; display: grid; gap: 8px; color: #c8d9cd; font-size: 13px; }
.identity button { justify-self: start; color: inherit; background: transparent; border-color: #47655d; }
main { width: min(100%, 1500px); padding: clamp(22px, 4vw, 62px); margin: 0 auto; min-width: 0; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(33px, 4.5vw, 58px); line-height: 1.04; letter-spacing: -.06em; }
h2 { font-size: 22px; letter-spacing: -.025em; line-height: 1.2; }
h3 { font-size: 16px; }
.eyebrow { font-size: 11px; font-weight: 800; color: var(--green); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px; }
.muted, small { color: var(--muted); }
p + p { margin-top: 9px; }
button, input, select { font: inherit; }
button, .button { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; white-space: normal; font-weight: 650; }
button:hover, .button:hover { border-color: var(--green); }
button:disabled { opacity: .55; cursor: wait; }
button.primary, .button.primary { background: var(--green); color: white; border-color: var(--green); }
button.primary:hover { background: var(--dark); }
button.text { background: transparent; padding: 0; border: 0; text-align: left; color: var(--green); text-decoration: underline; }
a { color: var(--green); }
:focus-visible { outline: 3px solid #b08740; outline-offset: 2px; }
input, select { width: 100%; min-width: 0; color: var(--ink); background: white; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; min-height: 40px; }
label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 650; }
label.check { display: flex; align-items: center; }
label.check input { width: auto; min-height: auto; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 17px; padding: clamp(15px, 2vw, 24px); margin-bottom: 16px; min-width: 0; }
.panel > * + * { margin-top: 14px; }
.filters, .cards, .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 13px; align-items: end; }
.filters .wide { grid-column: span 2; }
.actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); margin-bottom: 15px; align-items: stretch; }
.metric { margin: 0; min-height: 110px; }
.metric strong { display: block; font-size: clamp(22px, 3vw, 38px); letter-spacing: -.05em; line-height: 1.2; }
.metric:first-child { background: #deebd6; }
.chart { width: 100%; height: 300px; display: block; }
.table-wrap { overflow: auto; max-height: 510px; }
table { border-collapse: collapse; width: 100%; text-align: left; font-size: 13px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); background: #f2f6ed; position: sticky; top: 0; z-index: 1; }
caption { text-align: left; color: var(--muted); padding-bottom: 6px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .54fr); gap: 16px; }
.layout > * { min-width: 0; }
.tag { border-radius: 999px; background: #e7f0e2; padding: 2px 8px; color: var(--green); display: inline-block; font-size: 12px; }
.tag.warn { background: #fae8ca; color: #68480e; }
#notice, #login-error { border: 1px solid var(--line); border-radius: 9px; background: #fff7df; padding: 9px 12px; margin: 0 0 14px; }
.login { max-width: 570px; margin: 12vh auto; }
.login > * + * { margin-top: 18px; }
.login form { display: flex; gap: 10px; align-items: end; }
.login label { flex: 1; }
details summary { cursor: pointer; font-weight: 650; }
details > :not(summary) { margin-top: 12px; }
.break { overflow-wrap: anywhere; }
@media (max-width: 940px) { .layout { grid-template-columns: 1fr; } body { grid-template-columns: 185px minmax(0, 1fr); } }
@media (max-width: 640px) {
  body { display: block; } .sidebar { min-height: auto; gap: 10px; padding: 14px 18px; }
  nav { display: flex; overflow-x: auto; } nav button { min-width: max-content; } .identity { display: flex; align-items: center; }
  .page-head { display: block; } .page-head .actions { margin-top: 14px; } .filters .wide { grid-column: auto; }
}
@media print { body { display: block; background: white; } .sidebar, .page-head, .actions, .no-print, #notice { display: none !important; } main { padding: 0; } .panel { border: 0; padding: 0; } .table-wrap { max-height: none; overflow: visible; } }
.satellite-image { display: block; width: 100%; border: 1px solid var(--line); border-radius: 10px; aspect-ratio: 1000 / 580; object-fit: cover; background: #dce7dc; }

</style>
  <style>
.station-atlas {
  --atlas-ink: var(--foreground, #202825);
  --atlas-paper: var(--background, #fff);
  --atlas-ring: var(--ring, #08754b);
  --atlas-muted: var(--muted-foreground, #56645e);
  --atlas-line: var(--border, #d7ded9);
  --atlas-green: var(--primary, #21583e);
  --atlas-light: var(--accent-soft, #eef3ef);
  color: var(--atlas-ink);
  font-variant-numeric: tabular-nums;
  min-width: 0;
}
.station-atlas :is(h2,h3,p,figure,dl,dt,dd) { margin: 0; }
.station-atlas button { font: inherit; }
.station-atlas [hidden] { display: none !important; }
.station-atlas :is(button,summary,a,select,[tabindex]):focus-visible { outline: 2px solid var(--atlas-ring); outline-offset: 2px; }
.station-atlas .atlas-catalog {
  display: grid;
  grid-template-columns: clamp(190px, 20vw, 244px) minmax(0,1fr);
  border: 1px solid var(--atlas-line);
  background: var(--atlas-paper);
}
.station-atlas .atlas-registry { border-right: 1px solid var(--atlas-line); min-width: 0; }
.station-atlas :is(.atlas-panel-heading,.atlas-map-heading) { display: flex; align-items: center; min-height: 46px; padding: 9px 16px; border-bottom: 1px solid var(--atlas-line); gap: 9px; }
.station-atlas :is(.atlas-panel-heading,.atlas-map-heading) h2,
.station-atlas .atlas-related h3 { color: var(--atlas-ink); font-family: inherit; line-height: 1.35; font-size: 15px; font-weight: 650; letter-spacing: -.015em; }
.station-atlas :is(.atlas-total,.atlas-set-count) { color: var(--atlas-muted); font: 12px/1.3 ui-monospace, monospace; }
.station-atlas .atlas-panel-heading { justify-content: space-between; }
.station-atlas .atlas-registry-group h3 { padding: 15px 16px 5px; color: var(--atlas-muted); font-size: 11px; line-height: 1.45; font-weight: 550; letter-spacing: .025em; }
.station-atlas .atlas-station { display: flex; width: 100%; align-items: center; gap: 11px; margin: 0; padding: 9px 16px; background: var(--atlas-paper); color: var(--atlas-ink); border: 0; border-inline-start: 2px solid transparent; border-radius: 0; text-align: left; cursor: pointer; }
.station-atlas .atlas-station:hover { background: var(--atlas-light); }
.station-atlas .atlas-station[aria-pressed=true] { border-inline-start-color: var(--atlas-green); background: var(--atlas-light); }
.station-atlas .atlas-station:focus-visible { outline-offset: -2px; }
.station-atlas .atlas-radio { width: 8px; height: 8px; border: 1px solid #89958e; border-radius: 50%; flex: none; }
.station-atlas .atlas-station[aria-pressed=true] .atlas-radio { border-color: var(--atlas-green); background: var(--atlas-green); }
.station-atlas .atlas-station-text { display: grid; gap: 1px; min-width: 0; }
.station-atlas .atlas-station-text strong { font-size: 14px; line-height: 1.3; font-weight: 620; overflow-wrap: anywhere; }
.station-atlas .atlas-station-text small { color: var(--atlas-muted); font-size: 12px; line-height: 1.4; }
.station-atlas .atlas-station-selector { display: none; }
.station-atlas .atlas-map-region { min-width: 0; }
.station-atlas .atlas-map-heading { background: #fafbf9; }
.station-atlas .atlas-viewport { position: relative; isolation: isolate; height: clamp(320px, 38vh, 396px); overflow: hidden; cursor: grab; touch-action: none; background: #e7ece6; }
.station-atlas .atlas-viewport:active { cursor: grabbing; }
.station-atlas .atlas-viewport:focus-visible { outline-offset: -3px; }
.station-atlas :is(.atlas-grid,.atlas-tiles,.atlas-overlay) { position: absolute; inset: 0; pointer-events: none; }
.station-atlas .atlas-grid { overflow: hidden; background-color: #edf1ec; }
.station-atlas .atlas-grid span { position: absolute; color: #66756c; font: 10px/16px ui-monospace,monospace; }
.station-atlas .atlas-meridian { top: 0; bottom: 0; border-left: 1px solid #c8d2c8; padding-left: 4px; }
.station-atlas .atlas-parallel { left: 0; right: 0; border-top: 1px solid #c8d2c8; padding-left: 4px; }
.station-atlas .atlas-tiles img { position: absolute; width: 256px; height: 256px; max-width: none; user-select: none; }
.station-atlas .atlas-overlay button { position: absolute; pointer-events: auto; }
.station-atlas .atlas-area { padding: 0; border: 1.5px dashed #2e7650; border-radius: 0; background: #37845118; }
.station-atlas .atlas-area:hover, .station-atlas .atlas-area[aria-expanded=true] { background: #37845130; }
.station-atlas .atlas-area span, .station-atlas .atlas-marker span { position: absolute; display: block; padding: 5px 7px; color: #fff; background: #23563e; border-radius: 2px; white-space: nowrap; font: 600 11px/1.2 ui-monospace, monospace; }
.station-atlas .atlas-area span { left: 50%; bottom: 6%; transform: translateX(-50%); font-family: inherit; font-size: 12px; }
.station-atlas .atlas-marker { width: 15px; height: 15px; min-width: 0; min-height: 0; padding: 0; border: 2px solid white; border-radius: 50%; background: #2d694a; box-shadow: 0 0 0 1px #22543b; transform: translate(-50%,-50%); }
.station-atlas .atlas-marker span { top: 50%; left: 16px; transform: translateY(-50%); background: var(--atlas-paper); color: #1b4c35; border: 1px solid #96aa9d; }
.station-atlas .atlas-marker.atlas-label-left span { left: auto; right: 16px; }
.station-atlas .atlas-marker[aria-pressed=true] span { background: #23563e; color: white; border-color: #23563e; }
.station-atlas .atlas-controls { position: absolute; z-index: 1; top: 12px; right: 12px; display: grid; overflow: hidden; border: 1px solid #a4b3a8; border-radius: 4px; }
.station-atlas .atlas-controls button,.station-atlas .atlas-menu-close { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 0; color: var(--atlas-ink); background: var(--atlas-paper); font: 550 20px/1 system-ui,sans-serif; cursor: pointer; }
.station-atlas .atlas-controls button + button { border-top: 1px solid #c7cfc7; }
.station-atlas .atlas-controls button:hover,.station-atlas .atlas-menu-choice:hover { background: var(--atlas-light); }
.station-atlas .atlas-controls button:focus-visible { outline-offset: -3px; }
.station-atlas .atlas-map-menu { position: absolute; z-index: 2; left: 12px; top: 12px; display: grid; width: min(240px,calc(100% - 72px)); max-height: calc(100% - 24px); overflow: auto; box-sizing: border-box; padding: 8px; background: var(--atlas-paper); border: 1px solid #9cac9f; border-radius: 4px; }
.station-atlas .atlas-map-menu strong { padding: 5px 30px 8px 5px; font-size: 13px; }
.station-atlas .atlas-menu-choice { padding: 8px 5px; text-align: left; border: 0; border-radius: 2px; background: var(--atlas-paper); font-size: 13px; }
.station-atlas .atlas-menu-choice[aria-pressed=true] { color: var(--atlas-green); background: var(--atlas-light); font-weight: 650; }
.station-atlas .atlas-menu-close { position: absolute; top: 3px; right: 3px; width: 29px; height: 29px; }
.station-atlas .atlas-attribution,.station-atlas .atlas-map-status { position: absolute; bottom: 0; background: #fffffff2; color: #46584c; padding: 2px 5px; font-size: 10px; line-height: 1.4; }
.station-atlas .atlas-map-status { left: 0; }
.station-atlas .atlas-attribution { right: 0; }
.station-atlas .atlas-scale { position: absolute; left: 12px; bottom: 24px; height: 18px; color: #253d30; border: solid #253d30; border-width: 0 1px 2px; font: 10px/15px ui-monospace, monospace; text-align: center; text-shadow: 0 0 3px white, 0 0 3px white; pointer-events: none; }
.station-atlas .atlas-map-note { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 18px; padding: 8px 14px; border-top: 1px solid var(--atlas-line); color: var(--atlas-muted); font-size: 11px; line-height: 1.45; }
.station-atlas .atlas-map-note span { display: inline-flex; gap: 7px; align-items: center; }
.station-atlas .atlas-legend-area::before { content: ''; width: 14px; height: 9px; border: 1px dashed var(--atlas-green); background: #37845118; flex: none; }
.station-atlas .atlas-legend-point::before { content: ''; width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--atlas-green); }
.station-atlas .atlas-dossier { min-width: 0; margin-top: 25px; scroll-margin: 15px; }
.station-atlas .atlas-profile { display: flex; align-items: flex-start; gap: 17px; }
.station-atlas .atlas-photo { width: clamp(84px, 9vw, 120px); flex: none; }
.station-atlas .atlas-photo img,.station-atlas .atlas-photo .atlas-avatar { width: 100%; height: auto; aspect-ratio: 4 / 3; display: block; object-fit: cover; border-radius: 3px; }
.station-atlas .atlas-has-photo { width: clamp(112px, 11vw, 150px); }
.station-atlas .atlas-photo figcaption { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 3px; font-size: 10px; line-height: 1.4; color: var(--atlas-muted); overflow-wrap: anywhere; }
.station-atlas .atlas-info { flex: 1; min-width: 0; }
.station-atlas .atlas-identity { display: flex; gap: 5px 10px; align-items: baseline; flex-wrap: wrap; }
.station-atlas .atlas-identity h2 { font-size: clamp(23px, 2vw, 31px); font-weight: 620; line-height: 1.12; letter-spacing: -.035em; }
.station-atlas .atlas-id { color: var(--atlas-muted); font: 12px/1.4 ui-monospace, monospace; }
.station-atlas .atlas-info .atlas-description { margin-top: 6px; font-size: 14px; line-height: 1.5; }
.station-atlas .atlas-info .atlas-location { margin-top: 5px; color: var(--atlas-muted); font-size: 12px; line-height: 1.45; }
.station-atlas :is(.atlas-photo-link,.atlas-passport) { color: var(--atlas-green); text-decoration: underline; text-underline-offset: 2px; }
.station-atlas .atlas-passport { display: inline-block; margin-top: 5px; font-size: 12px; }
.station-atlas .atlas-facts { flex: 0 1 22%; min-width: 136px; display: grid; gap: 6px; padding-left: 16px; border-left: 1px solid var(--atlas-line); }
.station-atlas .atlas-facts dt { margin: 0; color: var(--atlas-muted); font-size: 11px; line-height: 1.5; }
.station-atlas .atlas-facts dd { font-size: 13px; line-height: 1.4; font-weight: 600; }
.station-atlas .atlas-related { margin-top: 20px; }
.station-atlas .atlas-related-heading { display: flex; gap: 7px; align-items: baseline; padding-bottom: 9px; }
.station-atlas .atlas-table-scroll { overflow-x: auto; }
.station-atlas .atlas-data-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; line-height: 1.4; }
.station-atlas .atlas-data-table :is(th, td) { position: static; text-align: left; border-bottom: 1px solid var(--atlas-line); vertical-align: middle; padding: 9px 12px; }
.station-atlas .atlas-data-table th { background: #f4f6f4; border-top: 1px solid var(--atlas-line); color: var(--atlas-muted); font-weight: 550; font-size: 12px; }
.station-atlas .atlas-data-table th:first-child { width: 50%; }
.station-atlas .atlas-data-table th:nth-child(3) { width: 14%; }
.station-atlas .atlas-data-table :is(td,th):nth-child(3) { text-align: right; }
.station-atlas .atlas-dataset { border: 0; border-radius: 0; background: transparent; color: var(--atlas-green); padding: 3px 0; text-decoration: none; text-underline-offset: 2px; text-align: left; font: inherit; font-weight: 620; line-height: 1.35; overflow-wrap: anywhere; }
.station-atlas .atlas-dataset:hover { text-decoration: underline; }
.station-atlas .atlas-source { display: block; font-size: 11px; color: var(--atlas-muted); }
.station-atlas .atlas-open { margin-left: 5px; }
.station-atlas .atlas-photo-upload { margin-top: 11px; }
.station-atlas .atlas-photo-upload summary { width: fit-content; color: var(--atlas-green); cursor: pointer; font-size: 13px; }
.station-atlas .atlas-photo-upload form { display: grid; gap: 9px; max-width: 420px; margin-top: 10px; }
.station-atlas .atlas-photo-upload button { justify-self: start; }
.station-atlas :is(.atlas-upload-feedback,.atlas-empty) { font-size: 13px; color: var(--atlas-muted); }
@media (max-width: 900px) {
  .station-atlas .atlas-catalog { grid-template-columns: minmax(155px,25%) minmax(0,1fr); }
  .station-atlas .atlas-facts { flex-basis: 25%; }
}
@media (max-width: 690px) {
  .station-atlas .atlas-catalog { grid-template-columns: minmax(0,1fr); }
  .station-atlas .atlas-registry { border-right: 0; }
  .station-atlas .atlas-registry :is(.atlas-panel-heading,.atlas-stations) { display: none; }
  .station-atlas .atlas-station-selector { display: flex; align-items: center; gap: 12px; font-size: 13px; padding: 10px 12px; color: var(--atlas-muted); border-bottom: 1px solid var(--atlas-line); }
  .station-atlas .atlas-station-selector select { min-width: 0; flex: 1; color: var(--atlas-ink); font-size: 14px; }
  .station-atlas .atlas-map-heading { min-height: 38px; padding: 7px 12px; }
  .station-atlas .atlas-viewport { height: clamp(258px,38vh,330px); }
  .station-atlas .atlas-identity h2 { font-size: 22px; }
  .station-atlas .atlas-profile { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 11px 13px; }
  .station-atlas .atlas-photo, .station-atlas .atlas-has-photo { width: 100%; }
  .station-atlas .atlas-facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 22px; border-left: 0; padding: 0; }
  .station-atlas .atlas-data-table th:first-child { width: 44%; }
  .station-atlas .atlas-data-table th:nth-child(3) { width: 20%; }
  .station-atlas .atlas-data-table :is(th,td) { padding: 8px 6px; }
  .station-atlas .atlas-map-note { padding: 7px 10px; }
}

.station-atlas .atlas-landmarks { position: absolute; inset: 0; pointer-events: none; }
.station-atlas .atlas-place { position: absolute; color: #495950; }
.station-atlas .atlas-place > i { position: absolute; width: 4px; height: 4px; transform: translate(-50%,-50%); border-radius: 50%; background: currentColor; }
.station-atlas .atlas-place--landmark { color: #4a6851; font-style: italic; }
.station-atlas .atlas-place > span { position: absolute; white-space: nowrap; font: 11px/14px system-ui, sans-serif; font-style: inherit; text-shadow: 0 1px 1px #f5f7f2,1px 0 1px #f5f7f2; }

.station-atlas [data-slot=tabs-list] { display: flex; gap: 25px; align-items: center; justify-content: flex-start; border-bottom: 1px solid var(--atlas-line); padding: 0; height: auto; }
.station-atlas [data-slot=tabs-trigger] { border: 0; border-bottom: 2px solid transparent; border-radius: 0; margin-bottom: -1px; padding: 10px 1px 11px; color: var(--atlas-muted); background: transparent; font-size: 14px; line-height: 1.3; font-weight: 570; box-shadow: none; }
.station-atlas [data-slot=tabs-trigger][data-state=active] { border-bottom-color: var(--atlas-green); color: var(--atlas-ink); font-weight: 690; }
.station-atlas [data-slot=tabs-trigger]:hover { color: var(--atlas-ink); }
.station-atlas [data-slot=tabs-content] { margin-top: 0; min-width: 0; }
.station-atlas .atlas-map-panel { padding-top: 16px; }
.station-atlas .atlas-register-heading { padding: 22px 0 12px; }
.station-atlas .atlas-register-count { color: var(--atlas-muted); font-size: 13px; line-height: 1.4; }
.station-atlas .atlas-register-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 0; background: var(--atlas-paper); }
.station-atlas .atlas-register-table :is(td,th) { position: static; padding: 15px 12px; border-bottom: 1px solid var(--atlas-line); text-align: left; overflow-wrap: anywhere; vertical-align: middle; }

/* Workspace palette. The station views and library components share these semantic tokens. */
:root {
  --background: #fff;
  --foreground: #202321;

  --accent: #244f3e;
  --accent-soft: #edf3ef;
  --ring: #48856a;
  --radius: 8px;
  --paper-hover: #f6f7f5;
  --canvas: var(--background);
  --ink: var(--foreground);
  --card: var(--background);
  --green: var(--primary);
  --muted: var(--muted-foreground);

}
:root[data-workspace-theme="violet"] {
  --primary: #694497; --accent: #64418e; --accent-soft: #f1edf7; --ring: #8261ab;
}
body {

  min-height: 100vh;
  border-top: 6px solid var(--primary);
  background: var(--background);
}

  position: sticky; top: 0; align-self: start;
  min-height: calc(100vh - 6px); height: max-content;

}
.brand-row { display: flex; align-items: center; gap: 9px; padding: 0 4px; min-height: 38px; }
.brand { display: inline-flex; gap: 3px; align-items: baseline; font-size: 23px; font-weight: 720; line-height: 1; letter-spacing: -.075em; }
.brand-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }
.icon-button { display:inline-grid; place-items:center; padding: 0; width: 34px; height: 34px; color: var(--foreground); background: transparent; border: 0; border-radius: 50%; }
.icon-button:hover { background: var(--paper-hover); }

#nav { display: grid; gap: 2px; margin: 0; }
#nav button { display:flex; align-items:center; gap: 13px; min-height: 42px; width:100%; background: transparent; border: 0; border-radius: 7px; color: #494d48; padding: 8px 12px; line-height: 1.35; font-family: inherit; font-size: 14px; font-weight: 500; text-align:left; }

#nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 670; }
#nav .workspace-create { background:var(--foreground); color:white; width: max-content; min-height:40px; margin: 0 0 16px 5px; padding: 9px 17px 9px 12px; border-radius: 24px; font-weight:650; }
#nav .workspace-create:hover, #nav .workspace-create[aria-current="page"] { background: var(--primary); color:white; }
.workspace-column { min-width:0; }

.workspace-toolbar { display:flex; align-items:center; justify-content:space-between; gap:clamp(12px,2vw,34px); padding-block: 16px; min-height:79px; }

.global-search:focus-within { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }

.access-dialog-overlay { position:fixed; inset:0; z-index:40; background:#14201865; }
.access-dialog-panel { position:fixed; z-index:41; right:0; top:0; bottom:0; width:min(100%,490px); overflow:auto; background:var(--background); color:var(--foreground); border-left:1px solid var(--border); padding:24px; }
.access-dialog-heading { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:start; border-bottom:1px solid var(--border); padding-bottom:15px; }
.access-dialog-title { margin:0; font-size:22px; letter-spacing:-.04em; }
.access-dialog-dataset { grid-column:1; margin:0; color:var(--muted); font-size:14px; overflow-wrap:anywhere; }
.access-dialog-close { grid-column:2; grid-row:1/3; align-self:start; background:transparent; color:var(--foreground); border:1px solid var(--border); border-radius:6px; min-height:32px; padding:3px 9px; }

@media (max-width:1000px) {

}
@media (max-width:720px) {

  body.is-nav-collapsed #nav button span { display:block; }
  body.is-nav-collapsed #nav button { justify-content:flex-start; padding-inline:12px; }
  #nav .workspace-create, body.is-nav-collapsed #nav .workspace-create { width:max-content; margin:0 0 6px 4px; }
  .workspace-toolbar, main { padding-inline:16px; }
  .workspace-toolbar { gap:8px; min-height:60px; padding-block:8px; }
  .global-search { height:38px; padding:0 10px; gap:7px; }
  .global-search input { height:34px; font-size:13px; }
  .global-search kbd, .toolbar-end #role { display:none; }
  .toolbar-end, .toolbar-end .identity { gap:6px; }
  .toolbar-end .identity button { width:28px; }
  .theme-control { position:relative; width:32px; height:32px; justify-content:center; }

[data-native-control-wrap] { position: relative; box-sizing: border-box; vertical-align: middle; }
.ui-native-select-wrap { display: inline-flex; min-width: 0; max-width: 100%; width: 100%; align-items: center; }
.ui-native-select-wrap > select[data-slot="native-select"] {
  width: 100%; min-width: 0; min-height: 2.4rem; border: 1px solid var(--border, #cbd3ce);
  border-radius: var(--radius, 6px); background: var(--background, #fff); color: var(--foreground, #1c2923);
  padding: .42rem 2rem .42rem .7rem; font: inherit; line-height: 1.35; appearance: none; cursor: pointer;
}
.ui-native-select-wrap:has(select[multiple], select[size]:not([size="1"])) > select {
  appearance: auto; padding: .4rem .65rem; min-height: auto;
}
.ui-select-indicator, .ui-checkbox-indicator, .ui-switch-thumb { pointer-events: none; position: absolute; }
.ui-select-indicator {
  right: .6rem; width: 1rem; height: 1rem; stroke: var(--muted-foreground, #54635b); fill: none;
  stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round;
}
.ui-native-select-wrap:has(select[multiple], select[size]:not([size="1"])) > .ui-select-indicator { display: none; }
.ui-checkbox-wrap, .ui-switch-wrap { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ui-checkbox-wrap > input[data-slot="checkbox"], .ui-switch-wrap > input[data-slot="switch"] {
  appearance: none; box-sizing: border-box; min-width: 0; min-height: 0; margin: 0; padding: 0;
  border: 1px solid var(--muted-foreground, #607067); background: var(--background, #fff); cursor: pointer;
}
.ui-checkbox-wrap > input[data-slot="checkbox"] { width: 1.05rem; height: 1.05rem; border-radius: 3px; }
.ui-checkbox-indicator { display: none; width: 1rem; height: 1rem; stroke: var(--primary-foreground, #fff); stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round; fill: none; }
.ui-checkbox-wrap > input:is(:checked, :indeterminate), .ui-switch-wrap > input:checked {
  background: var(--primary, #126449); border-color: var(--primary, #126449);
}
.ui-checkbox-wrap > input:is(:checked, :indeterminate) + .ui-checkbox-indicator { display: block; }
.ui-checkbox-indicator .ui-mixed, .ui-checkbox-wrap > input:indeterminate + .ui-checkbox-indicator .ui-check { display: none; }
.ui-checkbox-wrap > input:indeterminate + .ui-checkbox-indicator .ui-mixed { display: block; }
.ui-switch-wrap > input[data-slot="switch"] { width: 2rem; height: 1.15rem; border-radius: 1rem; background-color: var(--muted, #e1e4e0); }
.ui-switch-wrap > input[data-slot="switch"]:checked { background-color: var(--primary, #126449); }
.ui-switch-thumb { left: .14rem; width: .85rem; height: .85rem; border: 1px solid var(--muted-foreground, #607067); border-radius: 50%; background: var(--primary-foreground, #fff); }
.ui-switch-wrap > input:checked + .ui-switch-thumb { left: 1rem; border-color: transparent; }
[data-native-control-wrap] > :is(input, select):focus-visible { outline: 2px solid var(--ring, #287d65); outline-offset: 2px; }
[data-native-control-wrap]:has(> :is(input, select):disabled) { opacity: .55; }
[data-native-control-wrap] > :is(input, select):disabled { cursor: not-allowed; }
[data-native-control-wrap]:has(> [hidden]) { display: none; }
@media (forced-colors: active) {

  <style>
/* Flat, scrollable work surfaces share the palette of the station register. */
#content .panel {
  margin: 0;
  padding: 22px 0;
  border: 0;
  border-top: 1px solid var(--border);
  border-radius: 0;
  background: var(--background);
  color: var(--foreground);
  font-size: 14px;
  line-height: 1.5;
}
#content .panel h2 {
  font-size: clamp(18px, 1.6vw, 22px);
  line-height: 1.25;
  font-weight: 650;
  letter-spacing: -.035em;
}
#content .panel h3 { font-size: 16px; line-height: 1.35; letter-spacing: -.02em; }
#content .panel :where(.muted, small), #login :where(.muted, small) { color: var(--muted-foreground); }
#content .panel small { font-size: 12px; }
#content .panel code { overflow-wrap: anywhere; font: .9em ui-monospace, SFMono-Regular, Consolas, monospace; }
#content .panel > * + * { margin-top: 12px; }
#content .panel h2 + p, #content .panel h3 + p { margin-top: 5px; }
#content .panel a:not(.button) { color: var(--primary); text-underline-offset: 3px; }
#content .panel .actions, #header-actions, #examples { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }

/* Buttons, fields and status tones are supplied by the shared shadcn/ui controls. */
#content .panel label, #login label {
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
}
#content .panel label.check { display: flex; align-items: center; gap: 7px; min-height: 36px; }
#content .filters { grid-template-columns: repeat(auto-fit, minmax(min(100%, 144px), 1fr)); gap: 12px; }
#content :is(#filter-form, #satellite-form, #catalog-search) { padding-block: 17px; }
#examples { min-width: 0; }
#examples button { min-height: 32px; font-size: 12px; }
#content .panel details { padding-block: 11px; border-top: 1px solid var(--border); }
#content .panel summary { width: fit-content; color: var(--foreground); font-size: 13px; font-weight: 600; }

#slice > .cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  margin: 0;
  padding-block: 19px;
  border-top: 1px solid var(--border);
}
#slice .cards .metric {
  display: grid;
  align-content: start;
  gap: 4px;
  min-height: 0;
  padding: 0 clamp(12px, 2vw, 28px);
  border: 0;
  border-inline-start: 1px solid var(--border);
}
#slice .cards .metric:first-child { padding-inline-start: 0; border-inline-start: 0; }
#slice .cards .metric:last-child { padding-inline-end: 0; }
#slice .metric > * { margin: 0; }
#slice .metric > span { color: var(--muted-foreground); font-size: 12px; font-weight: 600; }
#slice .metric strong {
  font-size: clamp(23px, 2.8vw, 39px);
  line-height: 1.2;
  font-weight: 610;
  letter-spacing: -.055em;
  font-variant-numeric: tabular-nums;
}
#slice .metric small { line-height: 1.4; }
#content .chart {
  display: block;
  width: 100%;
  height: clamp(230px, 26vw, 330px);
  margin-top: 18px;
  background: var(--background);
}
#slice .chart + .actions {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 12px;
}
#slice .chart + .actions > span { margin-inline-end: auto; }
:is(#slice, #satellite-result) .layout { grid-template-columns: minmax(0, 1.8fr) minmax(250px, 1fr); gap: 0; }
:is(#slice, #satellite-result) .layout > .panel + .panel { padding-inline-start: 22px; border-inline-start: 1px solid var(--border); }
:is(#slice, #satellite-result) .layout > .panel:first-child { padding-inline-end: 22px; }
#quality p { font-size: 13px; font-variant-numeric: tabular-nums; }
#quality .muted { margin-top: 16px; }
#quality label { max-width: 210px; }
#view-form, #upload-form, #catalog-search .filters {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 10px;
}
#view-form { display: block; max-width: 680px; }
#view-form > button { margin-top: 12px; }
#column-tools .column-choices { display: grid; gap: 0; margin: 0; padding: 0; min-width: 0; border: 0; }
#column-tools legend { padding: 0 0 6px; font-size: 13px; font-weight: 600; }
#view-form [role=status] { margin-top: 6px; color: var(--muted-foreground); font-size: 12px; }
#column-tools .column-choice {
  display: grid;
  grid-template-columns: minmax(96px, 1fr) minmax(95px, 1.4fr) auto;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
#column-tools .column-choice > label:first-child { display: flex; align-items: center; gap: 7px; }
#column-tools .column-choice input:not([type=checkbox]) { min-height: 30px; padding-block: 4px; font-size: 13px; }
#column-tools .column-move { display: inline-flex; align-items: center; gap: 3px; }
#column-tools .column-move button { min-width: 28px; min-height: 30px; padding: 3px 6px; }
#column-tools [disabled] { cursor: default; }
#quality-rows .qc-row-filter { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
#quality-rows .qc-row-filter select { width: auto; max-width: 100%; }
#quality-rows .qc-flags { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#content .rule-status-list { display: grid; gap: 0; padding: 0; list-style: none; }
#content .rule-status-list > *, #content .event-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 5px 12px;
  margin: 0;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
#content .event-row time { color: var(--muted-foreground); font-size: 12px; }
#upload-form, #catalog-search .filters { max-width: 710px; }
#upload-form .wide { grid-column: auto; }
#upload-form input[type=file] { padding: 3px; overflow: hidden; }
#upload-form input::file-selector-button {
  min-height: 29px;
  margin-inline-end: 8px;
  padding-inline: 10px;
  background: var(--paper-hover);
  color: var(--foreground);
  border: 0;
  border-inline-end: 1px solid var(--border);
  font: inherit;
  cursor: pointer;
}
#mapping:empty { display: none; }
#mapping-form { display: grid; gap: 14px; padding-top: 15px; }
#mapping-form details { margin: 0; }

#content .panel .table-wrap {
  max-width: 100%;
  max-height: 490px;
  overflow: auto;
  overscroll-behavior-x: contain;
  border-block: 1px solid var(--border);
}
#content .panel table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
#content .panel :is(td, th) { padding: 9px 11px; border: 0; border-bottom: 1px solid var(--border); text-align: start; }
#content .panel th {
  position: sticky; top: 0; z-index: 1;
  color: var(--muted-foreground); background: var(--paper-hover); font-size: 12px; font-weight: 600;
}
#content .panel tbody tr:last-child td { border-bottom: 0; }
#content .panel tbody tr:hover { background: var(--paper-hover); }
#content .panel :is(td, th):first-child { padding-inline-start: 8px; }
#content .panel caption { padding-block: 6px; text-align: start; }

#catalog-list { display: block; margin: 0; }
#catalog-list .metric {
  display: flow-root;
  min-height: 0;
  padding-block: 17px;
  overflow-wrap: anywhere;
}
#catalog-list .metric > :where(h3, p, small) { max-width: 90ch; }
#catalog-list .metric > h3 { margin: 3px 0 6px; font-size: 18px; }
#catalog-list .metric > p { margin-block: 4px; font-size: 13px; line-height: 1.45; }
#catalog-list .metric > small { display: block; margin-top: 7px; font-variant-numeric: tabular-nums; }
#catalog-list .metric > .actions { display: inline-flex; margin-inline-end: 6px; }
#catalog-list .metric > a { display: inline-block; margin-inline-end: 8px; }
#catalog-list .metric > .tag { border: 0; border-radius: 0; background: transparent; color: var(--muted-foreground); padding: 0; font-size: 12px; font-weight: 600; }
#content .panel p:has(> .tag.warn), #content section.no-print > p:has([data-report]) {
  margin: 0;
  border-bottom: 1px solid var(--border);
  padding: 11px 0;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}
#content .panel p > .tag.warn { margin-inline-end: 5px; }
#content section.no-print > p:has([data-report]) small { color: var(--muted-foreground); }
#report .panel > p { max-width: 88ch; font-variant-numeric: tabular-nums; }
#report .panel > .chart { margin-block: 20px; }

#satellite-result .satellite-image { display: block; width: 100%; aspect-ratio: 1000 / 580; object-fit: contain; background: var(--paper-hover); border: 1px solid var(--border); border-radius: 3px; }
#satellite-result .panel > small { display: block; margin-top: 8px; }
#satellite-result .panel > article { padding: 14px 0 0; border-top: 1px solid var(--border); }
#satellite-result article p, #sat-image-status { font-size: 13px; }
#satellite-result article .actions { margin-top: 6px; gap: 12px; font-size: 13px; }
#notice, #login-error { padding: 9px 12px; border: 1px solid var(--border); border-radius: 5px; background: var(--paper-hover); color: var(--foreground); font-size: 13px; }
#login-error { width: min(100%, 440px); margin: 1rem auto; color: var(--destructive, #8c332d); background: var(--destructive-soft, #fff3f1); border-color: var(--destructive-border, #e7c4bf); }
#login { width: min(100%, 440px); margin: clamp(44px, 12vh, 120px) auto 0; color: var(--foreground); }
#login h1 { font-size: clamp(34px, 5vw, 50px); line-height: 1.1; letter-spacing: -.06em; font-weight: 660; }
#login .eyebrow { color: var(--muted-foreground); font-size: 13px; font-weight: 550; text-transform: none; letter-spacing: 0; }
#login > p:not(.eyebrow) { margin-top: 9px; color: var(--muted-foreground); }
#login-form { padding-block: 20px; border-block: 1px solid var(--border); }
#demo-logins.actions { gap: 8px; }
.access-dialog-content .dataset-access { border-top: 0; gap: 20px; }
.access-dialog-content .dataset-member-row { min-height: 49px; }
.access-dialog-content .dataset-owner-role { padding: 0; background: transparent; color: var(--muted-foreground); }

@media (max-width: 1040px) {
  :is(#slice, #satellite-result) .layout { grid-template-columns: 1fr; }
  :is(#slice, #satellite-result) .layout > .panel:first-child,
  :is(#slice, #satellite-result) .layout > .panel + .panel { padding-inline: 0; border-inline-start: 0; }
}
@media (max-width: 720px) {
  #content .panel { padding-block: 17px; }
  #content .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #content .filters .wide { grid-column: 1 / -1; }
  #catalog-search .filters, #upload-form { grid-template-columns: minmax(0, 1fr) auto; }
  #upload-form .wide { grid-column: auto; }
  #content .chart { height: 240px; }
  #header-actions:empty { display: none; }
  #slice .chart + .actions > span { flex-basis: 100%; }
}
@media (max-width: 540px) {
  #slice > .cards { grid-template-columns: 1fr; padding: 0; }
  #slice .cards .metric {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 2px 12px;
    padding: 8px 0;
    border: 0;
    border-bottom: 1px solid var(--border);
  }
  #slice .cards .metric:last-child { border-bottom: 0; }
  #slice .metric strong { grid-column: 2; grid-row: 1 / 3; font-size: 25px; align-self: center; }
  #slice .metric small { grid-column: 1; }
  #content .panel :is(td, th) { padding: 8px; }
  #catalog-search .filters, #upload-form, #view-form { grid-template-columns: 1fr; }
  #catalog-search button, #upload-form button, #view-form button { justify-self: start; }
}
@media print {
  #content .panel { padding: 0; border: 0; }
  #content .panel .table-wrap { max-height: none; overflow: visible; }
  #content .panel th { position: static; }
  #content .panel tr, #content .chart { break-inside: avoid; }
}

function prepareDemoForms() {
  const form = document.querySelector('#upload-form');
  if (form && !form.dataset.archiveExample) {
    form.dataset.archiveExample = 'true';
    const input = form.elements.file;
    input.required = false;
    input.disabled = true;
    // Run the live upload/mapping UI with the exact archive used to capture its API responses.
    Object.defineProperty(input, 'files', {value: [archivedFile()]});
    const note = document.createElement('p');
    note.className = 'muted';
    note.textContent = 'Архивный пример: ' + sampleUpload.name + '. Для импорта своих файлов откройте серверную версию.';
    form.prepend(note);
    form.querySelector('button').textContent = 'Проверить архивный пример';
  }
  const rule = document.querySelector('#rule-form');
  if (rule && !rule.dataset.localExample) {
    rule.dataset.localExample = 'true';
    rule.elements.recipient.value = 'Анна';
    const hint = document.createElement('p');
    hint.className = 'muted';
    hint.textContent = 'Правила демо хранятся в этой вкладке. Получение событий и доставка уведомлений работают в серверной версии.';
    rule.before(hint);
  }
  const mapping = document.querySelector('#mapping-form');
  if (mapping && !mapping.dataset.archiveExample) {
    mapping.dataset.archiveExample = 'true';
    // The snapshot captures the original mapping. Changing it requires the importer.
    for (const input of mapping.querySelectorAll('input,select')) {
      input.setAttribute('aria-disabled', 'true');
      if (input.matches('select,input[type=checkbox]')) input.disabled = true;
      else input.readOnly = true;
    }
    mapping.querySelector('button').textContent = 'Открыть архивный набор';
  }
}

function satelliteImage(params) {
  const day = params.get('day');
  const frame = satelliteLayers[[params.get('area'), params.get('layer')].join('|')];
  if (!frame || !/^\d{4}-\d{2}-\d{2}$/.test(day) || day < '2012-01-01' || day > utcDay())
    return reply('Выберите область, спутниковый слой и дату вплоть до сегодняшнего дня по UTC.');
  // Preserve each API-provided product lookback and shift its UTC links to the requested date.
  const offset = Date.parse(day) - Date.parse(frame.date);
  const shift = url => url.replace(/\d{4}-\d{2}-\d{2}/g, value =>
    new Date(Date.parse(value) + offset).toISOString().slice(0, 10));
  return Response.json({...frame, date: day, image_url: shift(frame.image_url), worldview: shift(frame.worldview),
    reference_products: frame.reference_products.map(product => product.granules ?
      {...product, granules: shift(product.granules)} : product)});
}

async function fetch(input, options = {}) {
  const url = new URL(input, 'https://preview.test');
  const path = url.pathname;
  const segments = path.split('/').map(decodeURIComponent);
  const method = options.method || 'GET';
  const id = segments[3];
  const base = '/api/datasets/' + id;
  const cards = [
    ...fixtures['/api/catalog'],
    ...fixtures['/api/datasets'],
    ...fixtures['/api/stations'].flatMap(station => station.datasets),
  ].filter(card => card.id === id);

  if (path.endsWith('/photo')) {
    if (method === 'PUT') {
      photos.set(path, options.body);
      const station = fixtures['/api/stations'].find(row => row.id === segments[5]);
      const dataset = station.datasets.find(row => row.id === id);
      dataset.photo_url = station.photo_url = path;
      dataset.photo_credit = station.photo_credit = url.searchParams.get('credit');
      return Response.json({photo_url: path, photo_credit: dataset.photo_credit});
    }
    return photos.has(path) ? new Response(photos.get(path)) : new Response(null, {status: 404});
  }

  if (segments[4] === 'members' && segments[5]) {
    const username = segments[5];
    const acl = fixtures[base + '/members'];
    acl.members = acl.members.filter(member => member.username !== username);
    if (method === 'PUT') {
      const member = {username, role: JSON.parse(options.body).role};
      acl.members.push(member);
      return Response.json(member);
    }
    return new Response(null, {status: 204});
  }

  if (path === base && method === 'PATCH' && cards.length) {
    const name = JSON.parse(options.body).name.trim();
    for (const card of cards) card.name = name;
    return Response.json(cards[0]);
  }
  if (path === base + '/visibility' && method === 'PUT') {
    const visibility = url.searchParams.get('shared') === 'true' ? 'shared' : 'private';
    for (const card of cards) card.visibility = visibility;
    return Response.json({visibility});
  }
  if (path === base + '/connect' && method === 'POST') {
    for (const card of cards) card.connected = true;
    return Response.json({connected: true});
  }
  if (path === '/api/catalog') {
    const search = (url.searchParams.get('q') || '').toLocaleLowerCase('ru');
    return Response.json(fixtures[path].filter(card => JSON.stringify(card).toLocaleLowerCase('ru').includes(search)));
  }
  if (path === '/api/satellite') return Response.json({...fixtures[path], today: utcDay()});
  if (path === '/api/satellite/imagery') return satelliteImage(url.searchParams);
  if (path === '/api/uploads' && method === 'POST') {
    return options.body.name === sampleUpload.name ? Response.json(sampleUpload.response) :
      reply('В автономном режиме доступен поставляемый архивный пример.');
  }
  if (path === '/api/imports/' + sampleUpload.response.hash && method === 'POST') {
    return Response.json({id: sampleUpload.dataset, reused: true});
  }
  if (path === '/api/views/default' && method === 'PUT') {
    fixtures['/api/views'].default = JSON.parse(options.body).columns;
    return Response.json({saved: true});
  }
  if (path === '/api/alerts/rules' && method === 'POST') {
    const body = JSON.parse(options.body);
    const list = fixtures['/api/alerts'].rules;
    if (!body.name?.trim() || !body.station?.trim() || !Object.hasOwn(fixtures['/api/dictionary'].parameters, body.parameter) ||
        !participants.has(body.recipient) || !(Number(body.coverage) > 0 && Number(body.coverage) <= 1))
      return reply('Проверьте имя, станцию, параметр, получателя и полноту правила.');
    const existing = list.find(item => JSON.stringify(item.body) === JSON.stringify(body));
    if (existing) return Response.json({id: existing.id});
    const id = 'local-rule-' + (list.length + 1);
    list.push({id, body, state: 'insufficient'});
    return Response.json({id});
  }
  if (path === base + '/quality') {
    const row = sampleQuality[[base, url.searchParams.get('station'), url.searchParams.get('day')].join('|')];
    return row && url.searchParams.get('parameter') === 't_air' ? Response.json(row) :
      reply('По выбранной станции и дате в архивной выборке нет данных.');
  }
  if (path === base + '/raw' && rawArchives[base]) {
    return new Response(decoded(rawArchives[base]), {headers: {'Content-Type': 'application/zip',
      'Content-Disposition': 'attachment; filename="station-sample.zip"'}});
  }
  if (path === base + '/dashboard') {
    return Response.json({url: null, detail: 'Grafana подключается администратором в серверной версии.'});
  }
  if (path === '/api/connectors/open-meteo') return reply('Получение новых наблюдений доступно в серверной версии.', 503);
  if ([base + '/series', base + '/export', base + '/reports'].includes(path)) {
    const fields = method === 'POST' ? JSON.parse(options.body) : Object.fromEntries(url.searchParams);
    const key = [base + '/series', fields.station, fields.step].join('|');
    const result = sampleSeries[key];
    if (!result || ['parameter', 'start', 'end'].some(key => fields[key] !== result[key]))
      return reply('Выберите полный период станции, указанный в карточке набора.');
    if (path.endsWith('/reports')) {
      const list = fixtures['/api/reports'];
      const reportId = 'local-report-' + (list.length + 1);
      const report = {...result, id: reportId, title: fields.title, template: fields.template,
        metadata: fixtures['/api/datasets'].find(row => row.id === id).metadata};
      fixtures['/api/reports/' + reportId] = report;
      list.unshift({id: reportId, title: report.title, created_at: new Date().toISOString(), dataset: id});
      return Response.json(report);
    }
    if (path.endsWith('/export') && fields.format === 'csv')
      return new Response(csvExports[key], {headers: {'Content-Type': 'text/csv'}});
    return Response.json(result);
  }
  if (Object.hasOwn(fixtures, path)) return Response.json(fixtures[path]);
  return reply('Для этого действия требуется серверная версия приложения.', 404);
}

// Sources are the linked Wikidata records (CC0) and Russian Wikipedia articles
// (contributors to each linked page, CC BY-SA 4.0). DMS converted to decimal.
const localLandmarks = [
  {name: 'Заповедный', kind: 'settlement', latitude: 56.45189, longitude: 32.96839,
    source: 'https://www.wikidata.org/wiki/Q4186740'},
  {name: 'Старосельский мох', kind: 'landmark', latitude: 56.47580, longitude: 33.03610,
    source: 'https://www.wikidata.org/wiki/Q4440641'},
  {name: 'Высокое', kind: 'settlement', latitude: 56.39250, longitude: 32.87694,
    source: 'https://ru.wikipedia.org/wiki/Высокое_(Высокинское_сельское_поселение)'},
  {name: 'Сосноватка', kind: 'settlement', latitude: 56.34444, longitude: 32.91611,
    source: 'https://ru.wikipedia.org/wiki/Сосноватка_(Нелидовский_район)'},
  {name: 'Жердовка', kind: 'settlement', latitude: 56.51028, longitude: 33.08917,
    source: 'https://ru.wikipedia.org/wiki/Жердовка_(Тверская_область)'},
  {name: 'Большие Ясновицы', kind: 'settlement', latitude: 56.51444, longitude: 33.03250,
    source: 'https://ru.wikipedia.org/wiki/Большие_Ясновицы'},
  {name: 'Нелидово', kind: 'settlement', latitude: 56.21667, longitude: 32.78333,
    source: 'https://www.wikidata.org/wiki/Q172366'},
];

const layers = new WeakMap();

function createLayer(container) {
  const items = localLandmarks.map(place => {
    const marker = document.createElement('span');
    marker.className = 'atlas-place atlas-place--' + place.kind;
    marker.title = place.name + ' · источник координат: ' + place.source;
    const dot = document.createElement('i');
    const label = document.createElement('span');
    label.textContent = place.name;
    marker.append(dot, label);
    container.append(marker);
    return {place, marker, label};
  });
  layers.set(container, items);
  return items;
}

function overlaps(box, other) {
  return box.left < other.right + 3 && box.right > other.left - 3 &&
    box.top < other.bottom + 2 && box.bottom > other.top - 2;
}

// position(longitude, latitude) returns CSS pixels relative to the map viewport.
// Occupied boxes describe interactive markers and map controls in the same frame.
function renderLocalLandmarks(container, position, width, height, occupied = []) {
  const items = layers.get(container) || createLayer(container);
  const taken = [...occupied];

    const [x, y] = position(place.longitude, place.latitude).map(Math.round);
    const point = {left: x - 2, right: x + 2, top: y - 2, bottom: y + 2};
    marker.hidden = x < 2 || x > width - 2 || y < 2 || y > height - 2 ||
      taken.some(box => overlaps(point, box));
    if (marker.hidden) continue;
    marker.style.left = x + 'px';
    marker.style.top = y + 'px';
    label.hidden = false;
    const w = label.offsetWidth;
    const h = label.offsetHeight;
    const offsets = [[5, -h / 2], [-w - 5, -h / 2], [-w / 2, 5], [-w / 2, -h - 5]];
    const box = offsets.map(([dx, dy]) => ({
      left: x + dx, top: y + dy, right: x + dx + w, bottom: y + dy + h,
    })).find(candidate => candidate.left >= 3 && candidate.top >= 3 &&
      candidate.right <= width - 3 && candidate.bottom <= height - 3 &&
      !taken.some(other => overlaps(candidate, other)));

    if (box) {
      label.style.left = Math.round(box.left - x) + 'px';
      label.style.top = Math.round(box.top - y) + 'px';

    }
  }
}

// DOM adapter for shadcn/ui's MIT-licensed Table; shares its semantic element
// and data-slot contract with the official Tasks data-table example.
// https://ui.shadcn.com/r/styles/new-york-v4/table.json
function stationDataTable({label, columns, className}) {
  const container = document.createElement('div');
  container.dataset.slot = 'table-container';
  container.className = 'atlas-table-scroll';

  const table = document.createElement('table');
  table.dataset.slot = 'table';
  if (className) table.className = className;
  table.setAttribute('aria-label', label);
  container.append(table);

  const header = table.createTHead();
  header.dataset.slot = 'table-header';
  const head = header.insertRow();
  head.dataset.slot = 'table-row';
  for (const column of columns) {
    const cell = document.createElement('th');
    cell.dataset.slot = 'table-head';
    cell.scope = 'col';
    cell.textContent = typeof column === 'string' ? column : column.label;
    if (column.className) cell.className = column.className;
    head.append(cell);
  }

  const body = table.createTBody();
  body.dataset.slot = 'table-body';
  return {container, table, head, body};
}

return {stationDataTable};
})();

  });
  if (area.length) overlay.append(group);
  for (const {marker} of markers) overlay.append(marker);

  function toggle(value) {
    open = value;
    menu.hidden = !value;
    group.setAttribute('aria-expanded', String(value));
    if (value) menu.querySelector('.atlas-menu-choice')?.focus();
  }

  function fit() {
    const bounds = [];
    if (area.length || !points.length) bounds.push([west, south], [east, north]);
    for (const station of points) bounds.push([station.longitude, station.latitude]);
    const xs = bounds.map(point => project(...point, 0)[0]);
    const ys = bounds.map(point => project(...point, 0)[1]);
    const left = Math.min(...xs), right = Math.max(...xs), top = Math.min(...ys), bottom = Math.max(...ys);
    focus = unproject((left + right) / 2, (top + bottom) / 2, 0);
    const k = Math.min((viewport.clientWidth - 54) / (right - left || 0.1), (viewport.clientHeight - 64) / (bottom - top || 0.1));
    zoom = Math.max(1, Math.min(12, Math.floor(Math.log2(Math.max(k, 2)))));
    fitted = true;
  }

  function render() {
    const w = viewport.clientWidth, h = viewport.clientHeight;
    if (!w || !h) return;
    if (!fitted) fit();
    const [cx, cy] = project(...focus, zoom);
    const x0 = cx - w / 2, y0 = cy - h / 2;
    const size = 2 ** zoom;
    const metersPerPixel = Math.cos(focus[1] * Math.PI / 180) * 40075016.7 / (256 * size);
    const target = 100 * metersPerPixel;
    const power = 10 ** Math.floor(Math.log10(target));
    const length = ([5, 2, 1].find(unit => unit * power <= target) || 1) * power;
    scale.style.width = Math.round(length / metersPerPixel) + 'px';
    scale.textContent = length >= 1000 ? numbers.format(length / 1000) + ' км' : length + ' м';
    const wanted = new Set();
    for (let y = Math.max(0, Math.floor(y0 / 256)); y <= Math.min(size - 1, Math.floor((y0 + h) / 256)); y++) {
      for (let x = Math.floor(x0 / 256); x <= Math.floor((x0 + w) / 256); x++) {
        if (x < 0 || x >= size) continue;
        const key = zoom + '/' + x + '/' + y;
        wanted.add(key);
        let tile = tiles.querySelector('[data-key="' + key + '"]');
        if (!tile) {
          tile = el('img');
          tile.alt = '';
          tile.draggable = false;
          tile.dataset.key = key;
          tile.onload = () => { tile.dataset.loaded = '1'; tile.hidden = false; syncStatus(); };
          tile.onerror = () => { tile.hidden = true; syncStatus(); };
          tile.hidden = true;
          tile.src = 'https://tile.openstreetmap.org/' + key + '.png';
          tiles.append(tile);
        }
        tile.style.left = Math.round(x * 256 - x0) + 'px';
        tile.style.top = Math.round(y * 256 - y0) + 'px';
      }
    }
    for (const tile of [...tiles.children]) if (!wanted.has(tile.dataset.key)) tile.remove();
    syncStatus();
    grid.replaceChildren();
    for (let x = 50; x < w; x += 125) {
      const tick = el('span', 'atlas-meridian', unproject(x + x0, cy, zoom)[0].toFixed(2) + '°');
      tick.style.left = x + 'px';
      grid.append(tick);
    }
    for (let y = 52; y < h; y += 84) {
      const tick = el('span', 'atlas-parallel', unproject(cx, y + y0, zoom)[1].toFixed(2) + '°');
      tick.style.top = y + 'px';
      grid.append(tick);
    }
    if (area.length) {
      const [left, top] = project(west, north, zoom), [right, bottom] = project(east, south, zoom);
      Object.assign(group.style, {left: left - x0 + 'px', top: top - y0 + 'px', width: right - left + 'px', height: bottom - top + 'px'});
    }
    const occupied = [
      {left: w - 55, top: 4, right: w, bottom: 123},
      {left: 0, top: h - 47, right: 126, bottom: h},
    ];
    if (area.length) {
      const [groupX, groupY] = project(center[0], south + (north - south) * 0.08, zoom);
      occupied.push({left: groupX - x0 - 58, right: groupX - x0 + 58, top: groupY - y0 - 18, bottom: groupY - y0 + 18});
    }
    for (const {station, marker} of markers) {
      const [x, y] = project(station.longitude, station.latitude, zoom);
      marker.style.left = x - x0 + 'px';
      marker.style.top = y - y0 + 'px';
      marker.setAttribute('aria-pressed', String(station.id === selected));
      // Place nearby labels on opposite sides, retaining the exact points.
      const neighbors = points.filter(other => {
        if (station === other) return false;
        const [nx, ny] = project(other.longitude, other.latitude, zoom);
        return Math.abs(x - nx) < 115 && Math.abs(y - ny) < 46;
      });
      const facesLeft = neighbors.some(other =>
        other.longitude > station.longitude || other.longitude === station.longitude && other.id > station.id);
      marker.classList.toggle('atlas-label-left', facesLeft);
      occupied.push({left: x - x0 - (facesLeft ? 80 : 8), right: x - x0 + (facesLeft ? 8 : 80),
        top: y - y0 - 15, bottom: y - y0 + 15});
    }
    renderLocalLandmarks(landmarks, (lon, lat) => {
      const [x, y] = project(lon, lat, zoom);
      return [x - x0, y - y0];
    }, w, h, occupied);
  }

  function syncStatus() {
    const hasTiles = Boolean(tiles.querySelector('[data-loaded]'));
    status.hidden = landmarks.hidden = hasTiles;
    attribution.hidden = !hasTiles;
  }
  function moveBy(x, y) {
    const [cx, cy] = project(...focus, zoom);
    const max = 256 * 2 ** zoom;
    focus = unproject(Math.min(max, Math.max(0, cx + x)), Math.min(max, Math.max(0, cy + y)), zoom);
    render();
  }
  function changeZoom(delta) { zoom = Math.max(1, Math.min(18, zoom + delta)); render(); }
  for (const [symbol, label, action] of [
    ['+', 'Увеличить масштаб', () => changeZoom(1)],
    ['−', 'Уменьшить масштаб', () => changeZoom(-1)],
    ['⌖', 'Показать все станции', () => { fit(); render(); }]
  ]) {
    const btn = button('', symbol, action);
    btn.setAttribute('aria-label', label);
    btn.title = label;
    control.append(btn);
  }
  viewport.addEventListener('keydown', event => {
    if (event.key === 'Escape' && open) { toggle(false); group.focus(); return; }
    if (event.target !== viewport) return;
    const actions = {ArrowLeft: () => moveBy(-64, 0), ArrowRight: () => moveBy(64, 0), ArrowUp: () => moveBy(0, -64), ArrowDown: () => moveBy(0, 64), '+': () => changeZoom(1), '-': () => changeZoom(-1)};
    if (actions[event.key]) { event.preventDefault(); actions[event.key](); }
  });
  viewport.addEventListener('pointerdown', event => {
    if (event.button !== 0 || event.target.closest('button, a, .atlas-map-menu')) return;
    toggle(false);
    drag = [event.clientX, event.clientY];
    viewport.setPointerCapture(event.pointerId);
  });
  viewport.addEventListener('pointermove', event => {
    if (!drag) return;
    moveBy(drag[0] - event.clientX, drag[1] - event.clientY);
    drag = [event.clientX, event.clientY];
  });
  viewport.addEventListener('lostpointercapture', () => { drag = null; });
  viewport.append(grid, tiles, landmarks, overlay, control, menu, scale, status, attribution);
  map.append(viewport);
  const observer = new ResizeObserver(render);
  observer.observe(viewport);
  return {map, select(station, recenter) {
    selected = station.id;
    for (const pick of menu.querySelectorAll('[data-station]')) pick.setAttribute('aria-pressed', String(pick.dataset.station === selected));
    if (recenter && (hasPoint(station) || area.includes(station))) {
      focus = hasPoint(station) ? [station.longitude, station.latitude] : center;
      if (!hasPoint(station)) zoom = Math.min(zoom, 10);
    }
    render();
  }, dispose: () => observer.disconnect()};
}

const siteNames = {
  AME60: 'Урочище Красное', KR1: 'Поляна', KR2: 'Поле',
  'RU-Fyo': 'Заболоченный ельник', 'RU-Fy2': 'Сухой ельник',
};

function searchable(value) {
  return String(value || '').toLocaleLowerCase('ru').replaceAll('ё', 'е')
    .replace(/[‐‑‒–—]/g, '-');
}

function stationRegister(panel, stations, open, input) {
  const toolbar = el('div', 'atlas-register-heading');
  const resultCount = el('p', 'atlas-register-count');
  resultCount.setAttribute('role', 'status');
  toolbar.append(resultCount);
  const {container: wrapper, head, body} = stationDataTable({
    label: 'Реестр метеостанций', className: 'atlas-register-table', columns: ['№', 'Станция', 'Площадка', 'Записей в наборах'],
  });
  const sortHead = head.lastElementChild;
  const sort = button('atlas-sort', 'Записей в наборах', () => {
    descending = !descending;
    refresh();
  });
  sortHead.replaceChildren(sort);
  const empty = el('div', 'atlas-no-results');
  empty.append(el('p', '', 'Станции не найдены'));
  if (input) {
    empty.append(button('atlas-clear-search', 'Сбросить поиск', () => {
      input.value = '';
      input.dispatchEvent(new Event('input', {bubbles: true}));
      input.focus();
    }));
  }
  panel.append(toolbar, wrapper, empty);
  const collator = new Intl.Collator('ru', {numeric: true});
  const rows = stations.map(station => {
    const code = station.code || station.id;
    const site = Object.hasOwn(siteNames, code) ? siteNames[code] : station.location_label || '—';
    const datasets = station.datasets || [];
    const count = datasets.length ? datasets.reduce((sum, item) => sum + (Number(item.rows) || 0), 0) : null;
    const text = searchable([station.name, code, site, station.description, station.location_label,
      ...datasets.map(d => d.name), ...(station.publications || []).map(p => p.name)].join(' '));
    return {station, site, code, count, text};
  });
  const maxCount = rows.reduce((max, row) => Math.max(max, row.count || 0), 1);
  let descending = true;

  function refresh() {
    const terms = searchable(input?.value).split(/\s+/).filter(Boolean);
    const matching = rows.filter(row => terms.every(term => row.text.includes(term)));
    matching.sort((a, b) => {
      if ((a.count === null) !== (b.count === null)) return a.count === null ? 1 : -1;
      return (descending ? b.count - a.count : a.count - b.count) || collator.compare(a.code, b.code);
    });
    resultCount.textContent = terms.length ? 'Найдено ' + matching.length + ' из ' + rows.length :
      counted(rows.length, 'станция', 'станции', 'станций');
    sortHead.setAttribute('aria-sort', descending ? 'descending' : 'ascending');
    sort.title = descending ? 'По убыванию. Изменить порядок' : 'По возрастанию. Изменить порядок';
    body.replaceChildren();
    matching.forEach(({station, site, code, count}, index) => {
      const row = body.insertRow();
      row.dataset.slot = 'table-row';
      row.insertCell().textContent = String(index + 1);
      const identify = button('atlas-name-link', '', () => open(station.id));
      identify.setAttribute('aria-label', 'Открыть станцию ' + (station.name || code));
      const name = el('span', 'atlas-register-name');
      name.append(el('strong', '', station.name || code));
      const source = station.location_kind === 'reference' ? 'FLUXNET' : 'Наблюдения';
      name.append(el('small', '', code === station.name ? source : code + ' · ' + source));
      identify.append(stationAvatar(station), name);
      row.insertCell().append(identify);
      row.insertCell().textContent = site;
      const measure = el('div', 'atlas-register-measure');
      measure.append(el('span', 'atlas-count', count === null ? '—' : numbers.format(count)));
      if (count !== null) {
        const track = el('span', 'atlas-count-bar');
        track.setAttribute('aria-hidden', 'true');
        const fill = el('span');
        fill.style.width = (100 * count / maxCount) + '%';
        track.append(fill);
        measure.append(track);
      }
      row.insertCell().append(measure);
      for (const cell of row.cells) cell.dataset.slot = 'table-cell';
      row.addEventListener('click', event => {
        if (!identify.contains(event.target)) open(station.id);
      });
    });
    empty.hidden = matching.length > 0;
    wrapper.hidden = !matching.length;
  }
  refresh();
  return refresh;
}

function mountStationAtlas(root, stations, {onOpenDataset, initialStation, onSelectStation, loadPhoto, onUploadPhoto, searchInput} = {}) {
  const atlas = el('section', 'station-atlas');
  root.replaceChildren(atlas);
  if (!stations.length) {
    atlas.append(el('p', 'atlas-empty', 'Здесь появятся станции из доступных вам наборов данных.'));
    return () => {};
  }
  const catalog = el('section', 'atlas-panel atlas-catalog');
  const dossier = el('article', 'atlas-panel atlas-dossier');
  const registry = el('div', 'atlas-registry');
  const header = el('div', 'atlas-panel-heading');
  header.append(el('h2', '', 'Станции'), el('span', 'atlas-total', stations.length));
  const list = el('div', 'atlas-stations');
  const mobileLabel = el('label', 'atlas-station-selector', 'Станция');
  const selector = el('select');
  selector.addEventListener('change', () => choose(selector.value));
  mobileLabel.append(selector);
  const spatial = makeMap(stations, choose);
  const stationButtons = new Map();
  let selected, previewRequest, previewURL;

  for (const [label, entries] of [
    ['Станции наблюдений', stations.filter(s => s.location_kind !== 'reference')],
    ['Опорные станции', stations.filter(s => s.location_kind === 'reference')],
  ]) {
    if (!entries.length) continue;
    const group = el('div', 'atlas-registry-group');
    group.setAttribute('role', 'group');
    group.setAttribute('aria-label', label);
    const options = el('optgroup');
    options.label = label;
    group.append(el('h3', '', label));
    for (const station of entries) {
      const btn = button('atlas-station', '', () => choose(station.id));
      const detail = el('span', 'atlas-station-text');
      const code = station.code || station.id;
      const name = station.name || code;
      const [title, subtitle] = Object.hasOwn(registryLabels, station.id) ? registryLabels[station.id] : [name, code !== name ? code : ''];
      detail.append(el('strong', '', title));
      if (subtitle) detail.append(el('small', '', subtitle));
      const glyph = el('span', 'atlas-radio');
      glyph.setAttribute('aria-hidden', 'true');
      btn.setAttribute('aria-label', name);
      btn.append(glyph, detail);
      group.append(btn);
      stationButtons.set(station.id, btn);
      const option = el('option', '', name);
      option.value = station.id;
      options.append(option);
    }
    list.append(group);
    selector.append(options);
  }
  const mapRegion = el('div', 'atlas-map-region');
  const hasArea = stations.some(station => station.location_kind === 'area' && !hasPoint(station));
  const hasReference = stations.some(station => station.location_kind === 'reference');
  const note = el('div', 'atlas-map-note');
  if (hasArea) note.append(el('span', 'atlas-legend-area', 'Район наблюдений. Координаты приборов уточняются.'));
  if (stations.some(hasPoint)) note.append(el('span', 'atlas-legend-point', 'Координаты станции'));
  if (!hasArea && !stations.some(hasPoint)) note.append(el('span', '', 'Координаты выбранных станций не указаны.'));
  const mapHeading = el('div', 'atlas-map-heading');
  mapHeading.append(el('h2', '', hasArea || hasReference ? 'Центрально-Лесной заповедник' : 'Район наблюдений'));
  mapRegion.append(mapHeading, spatial.map, note);
  registry.append(header, list, mobileLabel);
  catalog.append(registry, mapRegion);
  const tabHost = el('div', 'atlas-tab-host');
  const mapPanel = el('div', 'atlas-map-panel');
  mapPanel.append(catalog, dossier);
  const registryPanel = el('div', 'atlas-registry-panel');
  atlas.append(tabHost);
  const selectedAtEntry = stations.find(station => station.id === initialStation);
  const tabs = mountAtlasTabs(tabHost, {
    items: [
      {value: 'registry', label: 'Реестр станций', panel: registryPanel},
      {value: 'map', label: 'Карта', panel: mapPanel},
    ],
    initialValue: selectedAtEntry ? 'map' : 'registry',
  });
  function openStation(id) {
    tabs.select('map');
    choose(id);
  }
  const refreshRegistry = stationRegister(registryPanel, stations, openStation, searchInput);
  function findStations() {
    refreshRegistry();
    tabs.select('registry');
  }
  searchInput?.addEventListener('input', findStations);

  function clearPhoto() {
    previewRequest?.abort();
    if (previewURL) URL.revokeObjectURL(previewURL);
    previewURL = null;
  }

  function stationImage(station) {
    const figure = el('figure', 'atlas-photo');
    const img = el('img');
    const avatar = stationAvatar(station);
    const caption = el('figcaption');
    function addLink(url, text) {
      const link = externalLink(url, 'atlas-photo-link');
      if (link) {
        link.textContent = text;
        caption.append(link);
      }
    }
    function fallback() {
      img.onload = null;
      img.onerror = null;
      img.hidden = true;
      avatar.style.display = '';
      figure.classList.remove('atlas-has-photo');
      caption.replaceChildren(el('span', '', 'Аватар станции'));
      addLink(station.photo_page_url, 'Фотогалерея ↗');
    }
    function showPhoto(url) {
      img.onerror = fallback;
      img.onload = () => {
        avatar.style.display = 'none';
        img.hidden = false;
        figure.classList.add('atlas-has-photo');
        caption.replaceChildren(el('span', '', station.photo_credit ? 'Фото · ' + station.photo_credit : 'Фотография станции'));
        addLink(station.photo_source_url, 'Источник ↗');
        addLink(station.license_url || station.photo_license_url, station.photo_license || 'Лицензия ↗');
      };
      img.alt = 'Метеостанция ' + (station.name || station.id);
      img.src = url;
    }
    fallback();
    if (station.photo_url) {
      if (loadPhoto && station.photo_url.startsWith('/api/')) {
        previewRequest = new AbortController();
        const {signal} = previewRequest;
        Promise.resolve().then(() => loadPhoto(station.photo_url, {signal})).then(blob => {
          if (signal.aborted) return;
          previewURL = URL.createObjectURL(blob);
          showPhoto(previewURL);
        }).catch(() => { if (!signal.aborted) fallback(); });
      } else if (/^(?:https?:\/\/|\/(?!\/))/.test(station.photo_url)) showPhoto(station.photo_url);
    }
    figure.append(avatar, img, caption);
    return figure;
  }

  function photoForm(station, eligible) {
    const details = el('details', 'atlas-photo-upload');
    details.append(el('summary', '', station.photo_url ? 'Заменить фото' : 'Добавить фото'));
    const form = el('form');
    const file = el('input');
    file.type = 'file';
    file.required = true;
    file.accept = 'image/jpeg,image/png,image/webp';
    const fileLabel = el('label', '', 'Фото станции · JPG, PNG или WebP до 5 МиБ');
    fileLabel.append(file);
    const credit = el('input');
    credit.type = 'text';
    credit.maxLength = 160;
    const creditLabel = el('label', '', 'Автор или источник снимка');
    creditLabel.append(credit);
    const select = el('select');
    for (const d of eligible) {
      const option = el('option', '', datasetTitle(d, eligible));
      option.value = d.id;
      select.append(option);
    }
    if (eligible.length > 1) {
      const datasetLabel = el('label', '', 'Набор для размещения фото');
      datasetLabel.append(select);
      form.append(datasetLabel);
    }
    const submit = el('button', '', 'Сохранить фото');
    submit.type = 'submit';
    const feedback = el('span', 'atlas-upload-feedback');
    feedback.setAttribute('role', 'status');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (submit.disabled) return;
      const selectedFile = file.files[0];
      if (!selectedFile) return;
      if (selectedFile.size > 5 * 1024 * 1024) {
        feedback.textContent = 'Выберите файл размером до 5 МиБ.';
        return;
      }
      submit.disabled = true;
      feedback.textContent = 'Загрузка…';
      try {
        await onUploadPhoto(select.value, station.id, selectedFile, credit.value.trim());
        feedback.textContent = 'Фото сохранено.';
      } catch (error) {
        feedback.textContent = error?.message || 'Не удалось загрузить фото.';
      } finally {
        submit.disabled = false;
      }
    });
    form.append(fileLabel, creditLabel, submit, feedback);
    details.append(form);
    return details;
  }

  function choose(id, notify = true) {
    const station = stations.find(item => item.id === id);
    if (!station) return;
    if (selected === id) {
      if (notify && window.matchMedia('(max-width: 840px)').matches) dossier.scrollIntoView({block: 'start'});
      return;
    }
    clearPhoto();
    selected = id;
    selector.value = id;
    for (const [key, btn] of stationButtons) btn.setAttribute('aria-pressed', String(key === selected));
    spatial.select(station, notify);
    const info = el('div', 'atlas-info');
    const heading = el('div', 'atlas-identity');
    heading.append(el('h2', '', station.name || station.id));
    const code = station.code || station.id;
    if (code !== station.name) heading.append(el('span', 'atlas-id', code));
    info.append(heading);
    if (station.description) info.append(el('p', 'atlas-description', station.description));
    const location = hasPoint(station) ? [station.location_label, station.latitude.toFixed(4) + '°, ' + station.longitude.toFixed(4) + '°'].filter(Boolean).join(' · ') : station.location_label || 'Местоположение уточняется';
    info.append(el('p', 'atlas-location', location));
    const sets = station.datasets || [];
    const isReference = station.location_kind === 'reference';
    const facts = el('dl', 'atlas-facts');
    const starts = sets.map(d => d.start).filter(Boolean).sort();
    const ends = sets.map(d => d.end).filter(Boolean).sort();
    const rows = sets.reduce((sum, d) => sum + (Number(d.rows) || 0), 0);
    for (const [label, value] of [['Записи в наборах', numbers.format(rows)], ['Период наблюдений', period(starts[0], ends.at(-1))]]) {
      const fact = el('div');
      fact.append(el('dt', '', label), el('dd', '', value));
      facts.append(fact);
    }
    const related = el('section', 'atlas-related');
    const publications = station.publications || [];
    const relatedHeading = el('div', 'atlas-related-heading');
    relatedHeading.append(el('h3', '', isReference ? 'Опубликованные данные' : 'Наборы данных'),
      el('span', 'atlas-set-count', isReference ? publications.length : sets.length));
    related.append(relatedHeading);
    if (sets.length || publications.length) {
      const {container: wrapper, body} = stationDataTable({
        label: 'Данные станции ' + (station.name || code), className: 'atlas-data-table',
        columns: isReference ? ['Набор', 'Период'] : ['Набор', 'Период наблюдений', 'Записи'],
      });
      for (const d of sets) {
        const row = body.insertRow();
        const entry = button('atlas-dataset', datasetTitle(d, sets), () => onOpenDataset?.(d.id, station.id));
        const nameCell = row.insertCell();
        nameCell.append(entry);
        const sourceLabel = {station: 'Станционные наблюдения', stream: 'Поток наблюдений'}[d.source] || d.source;
        if (sourceLabel) nameCell.append(el('small', 'atlas-source', sourceLabel));
        row.insertCell().textContent = period(d.start, d.end);
        row.insertCell().textContent = numbers.format(Number(d.rows) || 0);

  const y = value => bottom - (value - min) * (bottom - top - 10) / span;

    open = true;
  });

  if (points.length <= 42) {
    context.fillStyle = line;
    points.forEach((row, index) => {
      if (row.value === null) return;
      context.beginPath(); context.arc(x(index), y(row.value), 3.1, 0, Math.PI * 2); context.fill();
    });
  }
  if (points.length) {
    context.fillStyle = text; context.textAlign = 'left'; context.fillText(points[0].start, left, height - 11);
    if (points.length > 1) {
      context.textAlign = 'right'; context.fillText(points.at(-1).end, right, height - 11);
    }

  if (!values.length) {
    context.textAlign = 'center'; context.fillText('За этот период значения исключены правилами качества', width / 2, height / 2);
