<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112b2a">
  <title>Метеоархив · AnalyticsHack</title>
  <style>
:root {
  color-scheme: light;
  --canvas: #eff3ec; --card: #fcfdf9; --ink: #152c29; --muted: #526761;
  --line: #d8e1d7; --green: #23634f; --dark: #122d2b; --accent: #bce3a7;
  font: 15px/1.55 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; margin: 0; background: var(--canvas); color: var(--ink); }
.sidebar { background: var(--dark); color: #ecf6e9; padding: 32px 19px 24px; min-height: 100vh; display: flex; flex-direction: column; gap: 43px; }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 750; font-size: 18px; }
.brand-icon { background: var(--accent); color: var(--dark); font-size: 24px; border-radius: 12px; padding: 0 9px; }
.brand small { display: block; color: #b3c4b9; font-size: 11px; font-weight: 500; letter-spacing: .11em; }
nav { display: grid; gap: 7px; }
nav button { text-align: left; color: #d4e3da; background: transparent; border-color: transparent; }
nav button[aria-current="page"], nav button:hover { background: #284840; color: #fff; }
.identity { margin-top: auto; display: grid; gap: 8px; color: #c8d9cd; font-size: 13px; }
.identity button { justify-self: start; color: inherit; background: transparent; border-color: #47655d; }
main { width: min(100%, 1500px); padding: clamp(22px, 4vw, 62px); margin: 0 auto; min-width: 0; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(33px, 4.5vw, 58px); line-height: 1.04; letter-spacing: -.06em; }
h2 { font-size: 22px; letter-spacing: -.025em; line-height: 1.2; }
h3 { font-size: 16px; }
.eyebrow { font-size: 11px; font-weight: 800; color: var(--green); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px; }
.muted, small { color: var(--muted); }
p + p { margin-top: 9px; }
button, input, select { font: inherit; }
button, .button { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; white-space: normal; font-weight: 650; }
button:hover, .button:hover { border-color: var(--green); }
button:disabled { opacity: .55; cursor: wait; }
button.primary, .button.primary { background: var(--green); color: white; border-color: var(--green); }
button.primary:hover { background: var(--dark); }
button.text { background: transparent; padding: 0; border: 0; text-align: left; color: var(--green); text-decoration: underline; }
a { color: var(--green); }
:focus-visible { outline: 3px solid #b08740; outline-offset: 2px; }
input, select { width: 100%; min-width: 0; color: var(--ink); background: white; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; min-height: 40px; }
label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 650; }
label.check { display: flex; align-items: center; }
label.check input { width: auto; min-height: auto; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 17px; padding: clamp(15px, 2vw, 24px); margin-bottom: 16px; min-width: 0; }
.panel > * + * { margin-top: 14px; }
.filters, .cards, .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 13px; align-items: end; }
.filters .wide { grid-column: span 2; }
.actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); margin-bottom: 15px; align-items: stretch; }
.metric { margin: 0; min-height: 110px; }
.metric strong { display: block; font-size: clamp(22px, 3vw, 38px); letter-spacing: -.05em; line-height: 1.2; }
.metric:first-child { background: #deebd6; }
.chart { width: 100%; height: 300px; display: block; }
.table-wrap { overflow: auto; max-height: 510px; }
table { border-collapse: collapse; width: 100%; text-align: left; font-size: 13px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); background: #f2f6ed; position: sticky; top: 0; z-index: 1; }
caption { text-align: left; color: var(--muted); padding-bottom: 6px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .54fr); gap: 16px; }
.layout > * { min-width: 0; }
.tag { border-radius: 999px; background: #e7f0e2; padding: 2px 8px; color: var(--green); display: inline-block; font-size: 12px; }
.tag.warn { background: #fae8ca; color: #68480e; }
#notice, #login-error { border: 1px solid var(--line); border-radius: 9px; background: #fff7df; padding: 9px 12px; margin: 0 0 14px; }
.login { max-width: 570px; margin: 12vh auto; }
.login > * + * { margin-top: 18px; }
.login form { display: flex; gap: 10px; align-items: end; }
.login label { flex: 1; }
details summary { cursor: pointer; font-weight: 650; }
details > :not(summary) { margin-top: 12px; }
.break { overflow-wrap: anywhere; }
@media (max-width: 940px) { .layout { grid-template-columns: 1fr; } body { grid-template-columns: 185px minmax(0, 1fr); } }
@media (max-width: 640px) {
  body { display: block; } .sidebar { min-height: auto; gap: 10px; padding: 14px 18px; }
  nav { display: flex; overflow-x: auto; } nav button { min-width: max-content; } .identity { display: flex; align-items: center; }
  .page-head { display: block; } .page-head .actions { margin-top: 14px; } .filters .wide { grid-column: auto; }
}
@media print { body { display: block; background: white; } .sidebar, .page-head, .actions, .no-print, #notice { display: none !important; } main { padding: 0; } .panel { border: 0; padding: 0; } .table-wrap { max-height: none; overflow: visible; } }
.satellite-image { display: block; width: 100%; border: 1px solid var(--line); border-radius: 10px; aspect-ratio: 1000 / 580; object-fit: cover; background: #dce7dc; }

</style>
  <style>
.station-atlas {
  --atlas-paper: #fffefa;
  --atlas-line: #d9e2d7;
  --atlas-ink: #192f28;
  --atlas-muted: #52675b;
  --atlas-green: #226447;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  align-items: start;
  gap: 18px;
  color: var(--atlas-ink);
}
.station-atlas .atlas-panel {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--atlas-line);
  border-radius: 17px;
  background: var(--atlas-paper);
}
.station-atlas :is(h2, h3, p, figure, dl, dt, dd) { margin: 0; }
.station-atlas button { font: inherit; }
.station-atlas :is(button, summary, a, [tabindex]):focus-visible {
  outline: 3px solid #176a91;
  outline-offset: 2px;
  z-index: 5;
}
.station-atlas .atlas-panel-heading,
.station-atlas .atlas-related-heading { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.station-atlas .atlas-panel-heading { padding: 19px 20px 15px; }
.station-atlas .atlas-panel-heading h2,
.station-atlas .atlas-identity h2 { font-size: 1.32rem; line-height: 1.18; letter-spacing: -.035em; }
.station-atlas .atlas-total,
.station-atlas .atlas-set-count {
  border-radius: 20px;
  padding: 3px 9px;
  color: var(--atlas-green);
  background: #eaf2e6;
  font-size: .77rem;
  font-weight: 700;
  white-space: nowrap;
}
.station-atlas .atlas-map { margin: 0 10px; border: 1px solid #c3cfc2; border-radius: 11px; overflow: hidden; }
.station-atlas .atlas-viewport {
  position: relative;
  isolation: isolate;
  height: clamp(280px, 43vh, 440px);
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  background: #e7eee1;
}
.station-atlas .atlas-viewport:active { cursor: grabbing; }
.station-atlas .atlas-viewport:focus-visible { outline-offset: -4px; }
.station-atlas :is(.atlas-grid, .atlas-tiles, .atlas-overlay) { position: absolute; inset: 0; pointer-events: none; }
.station-atlas .atlas-grid { overflow: hidden; background: linear-gradient(140deg,#dce9d6,#ecf0e4); }
.station-atlas .atlas-grid span { position: absolute; color: #526a54; font: 10px/16px ui-monospace, monospace; }
.station-atlas .atlas-meridian { top: 0; bottom: 0; border-left: 1px solid #acbeaa; padding-left: 4px; }
.station-atlas .atlas-parallel { left: 0; right: 0; border-top: 1px solid #acbeaa; padding-left: 4px; }
.station-atlas .atlas-tiles img { position: absolute; width: 256px; height: 256px; max-width: none; user-select: none; }
.station-atlas .atlas-overlay button { position: absolute; pointer-events: auto; }
.station-atlas .atlas-area {
  display: grid;
  place-items: center;
  padding: 0;
  border: 2px dashed #236449;
  border-radius: 2px;
  background: #54a46929;
  color: white;
}
.station-atlas .atlas-area:hover, .station-atlas .atlas-area[aria-expanded=true] { background: #54a46945; }
.station-atlas .atlas-area span, .station-atlas .atlas-marker span {
  max-width: max-content;
  padding: 6px 9px;
  border-radius: 7px;
  background: #194d36;
  color: #fff;
  box-shadow: 0 2px 8px #1a392930;
  font-size: .76rem;
  line-height: 1.15;
  font-weight: 700;
  white-space: nowrap;
}
.station-atlas .atlas-marker {
  width: 20px;
  height: 20px;
  min-width: 0;
  min-height: 0;
  padding: 0;
  border: 3px solid white;
  border-radius: 50%;
  background: #22694d;
  box-shadow: 0 0 0 1px #184f38;
  transform: translate(-50%,-50%);
}
.station-atlas .atlas-marker span { position: absolute; top: -9px; left: 21px; }
.station-atlas .atlas-marker[aria-pressed=true] { background: #adce43; }
.station-atlas .atlas-controls {
  position: absolute;
  z-index: 1;
  top: 11px;
  right: 11px;
  display: grid;
  border: 1px solid #c5d0c5;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 3px 9px #1e392a19;
}
.station-atlas .atlas-controls button, .station-atlas .atlas-menu-close {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: #fffefa;
  font: 600 1.2rem/1 system-ui, sans-serif;
}
.station-atlas .atlas-controls button + button { border-top: 1px solid var(--atlas-line); }
.station-atlas .atlas-controls button:hover, .station-atlas .atlas-menu-choice:hover { background: #edf4e8; }
.station-atlas .atlas-controls button:focus-visible { outline-offset: -3px; }
.station-atlas .atlas-map-menu {
  position: absolute;
  z-index: 2;
  left: 10px;
  top: 10px;
  display: grid;
  width: min(225px,calc(100% - 68px));
  max-height: calc(100% - 24px);
  overflow: auto;
  box-sizing: border-box;
  padding: 8px;
  background: #fffefa;
  border: 1px solid var(--atlas-line);
  border-radius: 10px;
  box-shadow: 0 4px 18px #183d2930;
}
.station-atlas .atlas-map-menu strong { padding: 6px 25px 8px 4px; font-size: .84rem; }
.station-atlas .atlas-menu-choice { text-align: left; padding: 6px; border: 0; background: transparent; font-size: .82rem; }
.station-atlas .atlas-menu-choice[aria-pressed=true] { color: var(--atlas-green); background: #eaf2e7; font-weight: 700; }
.station-atlas .atlas-menu-close { position: absolute; right: 5px; top: 3px; width: 30px; height: 30px; background: transparent; }
.station-atlas .atlas-attribution,
.station-atlas .atlas-map-status {
  position: absolute;
  bottom: 0;
  background: #fffefbeb;
  color: #364c3e;
  padding: 2px 5px;
  font-size: .64rem;
  line-height: 1.5;
}
.station-atlas .atlas-map-status { left: 0; }
.station-atlas .atlas-attribution { right: 0; }
.station-atlas [hidden] { display: none !important; }
.station-atlas .atlas-map-note { margin: 8px 16px 15px; font-size: .77rem; color: var(--atlas-muted); line-height: 1.4; }
.station-atlas .atlas-stations { display: grid; border-top: 1px solid var(--atlas-line); }
.station-atlas .atlas-station {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 19px;
  border: 0;
  border-bottom: 1px solid #e7ece4;
  border-radius: 0;
  background: transparent;
  color: var(--atlas-ink);
  text-align: left;
}
.station-atlas .atlas-station:last-child { border-bottom: 0; }
.station-atlas .atlas-station:hover, .station-atlas .atlas-dataset:hover { background: #f0f5ec; }
.station-atlas .atlas-station[aria-pressed=true] { background: #eaf2e4; box-shadow: inset 3px 0 var(--atlas-green); }
.station-atlas .atlas-station:focus-visible { outline-offset: -3px; }
.station-atlas .atlas-radio { width: 14px; height: 14px; border: 1.5px solid #879d8b; border-radius: 50%; flex: none; }
.station-atlas .atlas-station[aria-pressed=true] .atlas-radio { background: var(--atlas-green); border-color: var(--atlas-green); box-shadow: inset 0 0 0 3px #eaf2e4; }
.station-atlas .atlas-station-text { display: flex; flex: 1; min-width: 0; gap: 6px 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.station-atlas .atlas-station-text strong, .station-atlas .atlas-dataset strong { font-size: .91rem; overflow-wrap: anywhere; }
.station-atlas small { color: var(--atlas-muted); font-size: .76rem; }
.station-atlas .atlas-photo { position: relative; background: #c9d7c4; }
.station-atlas .atlas-photo img { display: block; width: 100%; height: clamp(138px, 17vw, 223px); object-fit: cover; }
.station-atlas .atlas-photo figcaption { position: absolute; right: 8px; bottom: 8px; padding: 3px 6px; border-radius: 4px; max-width: calc(100% - 16px); background: #15271ed9; color: white; font-size: .66rem; }
.station-atlas .atlas-info { padding: 16px 19px 14px; }
.station-atlas .atlas-identity { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; }
.station-atlas .atlas-id { order: 1; border: 1px solid #d4dfd3; color: var(--atlas-muted); border-radius: 4px; padding: 2px 5px; font: .69rem/1.2 ui-monospace, monospace; overflow-wrap: anywhere; }
.station-atlas .atlas-description, .station-atlas .atlas-location { margin-top: 7px; color: var(--atlas-muted); font-size: .85rem; line-height: 1.5; }
.station-atlas .atlas-location { color: var(--atlas-green); font-weight: 650; font-size: .77rem; }
.station-atlas .atlas-facts { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.65fr); margin: 0 19px; padding: 11px 0; border-block: 1px solid var(--atlas-line); gap: 10px; }
.station-atlas .atlas-facts dt { font-size: .72rem; color: var(--atlas-muted); }
.station-atlas .atlas-facts dd { margin-top: 3px; font-weight: 650; font-size: .87rem; line-height: 1.4; }
.station-atlas .atlas-related { padding: 13px 19px 17px; }
.station-atlas .atlas-related-heading { justify-content: start; margin-bottom: 4px; }
.station-atlas .atlas-related h3 { font-size: 1rem; letter-spacing: -.01em; }
.station-atlas .atlas-set-count { padding: 1px 7px; font-size: .73rem; }
.station-atlas .atlas-dataset { width: 100%; display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 3px; text-align: left; border: 0; border-radius: 5px; background: transparent; }
.station-atlas .atlas-dataset + .atlas-dataset { border-top: 1px solid #e6eae3; }
.station-atlas .atlas-dataset-text { min-width: 0; display: grid; gap: 2px; }
.station-atlas .atlas-source { overflow-wrap: anywhere; }
.station-atlas .atlas-open { font-size: 1.2rem; color: var(--atlas-green); }
.station-atlas .atlas-photo-upload { margin: 0 19px 16px; border-top: 1px solid var(--atlas-line); padding-top: 8px; }
.station-atlas .atlas-photo-upload summary { width: fit-content; cursor: pointer; color: var(--atlas-green); font-weight: 650; font-size: .8rem; }
.station-atlas .atlas-photo-upload form { display: grid; gap: 7px; margin-top: 9px; }
.station-atlas .atlas-photo-upload button { justify-self: start; font-size: .85rem; }
.station-atlas .atlas-upload-feedback,
.station-atlas .atlas-empty { font-size: .84rem; color: var(--atlas-muted); }
@media (max-width: 1080px) {
  .station-atlas { grid-template-columns: minmax(0,1.12fr) minmax(0,1fr); gap: 12px; }
}
@media (max-width: 840px) {
  .station-atlas { grid-template-columns: minmax(0,1fr); }
  .station-atlas .atlas-photo img { height: clamp(150px, 29vw, 230px); }
  .station-atlas .atlas-viewport { height: 310px; }
}
@media (max-width: 460px) {
  .station-atlas .atlas-viewport { height: 270px; }
  .station-atlas .atlas-controls button { width: 40px; height: 40px; }
  .station-atlas .atlas-panel-heading { padding: 14px; }
  .station-atlas .atlas-info, .station-atlas .atlas-related { padding-inline: 14px; }
  .station-atlas .atlas-facts { margin-inline: 14px; }
}
.station-atlas .atlas-area span {
  position: absolute;
  left: 50%;
  bottom: 5%;
  transform: translateX(-50%);
}
.station-atlas .atlas-marker span {
  display: grid;
  place-items: center;
  top: 50%;
  min-height: 31px;
  transform: translateY(-50%);
}
.station-atlas .atlas-marker.atlas-label-left span { left: auto; right: 21px; }
.station-atlas a.atlas-dataset { color: inherit; text-decoration: none; }
.station-atlas .atlas-passport { display: inline-block; margin-top: 6px; color: var(--atlas-green); font-size: .8rem; }
.station-atlas .atlas-photo .atlas-avatar {
  display: block;
  width: 100%;
  height: clamp(138px, 17vw, 223px);
}
.station-atlas .atlas-photo figcaption {
  display: flex;
  flex-wrap: wrap;
  gap: 1px 9px;
  align-items: baseline;
}
.station-atlas .atlas-photo-link { color: #fff; text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 840px) {
  .station-atlas .atlas-photo .atlas-avatar { height: clamp(150px, 29vw, 230px); }
}

</style>
  <style>

}

</style>

<script>
(()=>{
// Original geometric portraits. The seed only chooses artwork, never account permissions.
const palettes = [
  ['#f6d7ad', '#eb9f69', '#553c48', '#396e77', '#8fc8bb'],
  ['#d5dcb7', '#eab579', '#4a403a', '#407357', '#a9ca8d'],

  ['#badbd7', '#ce8660', '#433d4e', '#cc7561', '#f0b990'],
  ['#efcabb', '#f1be8f', '#614256', '#5e70a1', '#a9bbcc'],
  ['#edd88e', '#b97458', '#443541', '#437571', '#8fb7a1'],
];
const haircuts = [
  '<path d="M13 24c-1-10 2-15 11-15 7 0 11 6 11 13l-4-5c-3 1-8 0-11-2-1 4-3 7-7 9Z"/>',
  '<path d="M13 23c-2-3-2-6 0-8-2-4 2-7 5-6 2-5 7-4 9-2 4-1 7 1 7 4 5 2 4 8 0 11l-3-5c-4 3-10 3-15 0Z"/>',
  '<path d="M12 24v-5c0-7 5-12 12-12s12 5 12 12v7l-3-2-1-6c-5 0-10-1-13-4 0 3-3 6-7 10Z"/>',
  '<path d="M13 24v-5c0-6 5-10 11-10s11 4 11 10v6l-3-2v-5H16v5Z"/><path d="M11 17c0-3 2-5 4-6 0-4 4-6 8-5 4-2 9 1 10 5 2 1 4 3 4 6Z"/>',
  '<path d="M12 23c-1-5 0-11 5-14 0-4 4-5 8-4 6-1 11 4 11 11l-1 8-3-3v-5c-6 1-11-1-14-3-1 3-3 7-6 10Z"/>',
];
const collars = [
  '<path d="m17 35 7 5 7-5-3 10-4-3-4 3Z"/>',
  '<path d="m16 36 3-3 5 5 5-5 3 3-4 7-4-4-4 4Z"/>',
  '<path d="M16 35q8 8 16 0l1 3q-9 9-18 0Z"/>',
];

function humanAvatar(username) {
  let seed = 2166136261;
  for (const letter of String(username ?? '').normalize('NFC')) {
    seed = Math.imul(seed ^ letter.codePointAt(0), 16777619) >>> 0;
  }
  const [background, skin, ink, jacket, trim] = palettes[seed % palettes.length];
  const hair = haircuts[(seed >>> 8) % haircuts.length];
  const collar = collars[(seed >>> 16) % collars.length];
  const glasses = (seed >>> 24) % 4 === 0
    ? '<path d="M16 23h6v2q-3 3-6 0Zm10 0h6v2q-3 3-6 0Zm-4 1h4" fill="none" stroke-width="1.3"/>'
    : '';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <rect width="48" height="48" fill="${background}"/>
    <circle cx="39" cy="5" r="16" fill="#fff" opacity=".22"/>
    <path d="M0 48c2-8 7-12 17-14h14c10 2 15 6 17 14" fill="${jacket}"/>
    <path d="M20 29h8v6l-4 4-4-4Z" fill="${skin}"/>
    <path d="M20 30h8v2c-2 3-6 3-8 1Z" fill="${ink}" opacity=".2"/>
    <path d="M14 21c-4-2-4 5 0 6h1q2 6 9 7 7-1 9-7h1c4-1 4-8 0-6v-3c0-7-5-9-10-9s-10 2-10 9Z" fill="${skin}"/>
    <g fill="${ink}">${hair}<circle cx="19.5" cy="24" r=".9"/><circle cx="28.5" cy="24" r=".9"/></g>
    <g stroke="${ink}" stroke-linecap="round">${glasses}<path d="M22 29q2 1.4 4 0" fill="none" stroke-width="1"/></g>
    <g fill="${trim}">${collar}</g>
  </svg>`;
  const image = document.createElement('img');
  image.className = 'human-avatar';
  image.alt = '';
  image.width = image.height = 34;
  image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return image;
}

Object.assign(window,{humanAvatar});
})();

(()=>{



function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function field(label, input) {
  const node = element('label', label);
  node.append(input);
  return node;
}

function roleSelector(current = 'reader') {
  const select = element('select');
  for (const [value, label] of [['reader', 'Читатель'], ['editor', 'Редактор']]) {
    const option = element('option', label);
    option.value = value;
    select.append(option);
  }
  select.value = current;
  return select;
}

function command(label, type = 'button', className = '') {
  const button = element('button', label, className);
  button.type = type;
  return button;
}

function statusLine() {
  const live = element('p', '', 'dataset-access-status');
  live.setAttribute('role', 'status');
  live.setAttribute('aria-live', 'polite');
  return live;
}

function mountDatasetSettings(root, dataset, api, {onRename, onVisibility} = {}) {
  root.replaceChildren();
  if (!dataset.can_edit && !dataset.can_manage_access) return;

  const panel = element('section', undefined, 'dataset-access');
  panel.setAttribute('aria-label', 'Настройки набора ' + dataset.name);
  root.append(panel);
  const endpoint = '/api/datasets/' + encodeURIComponent(dataset.id);

  if (dataset.can_edit) {
    const form = element('form', undefined, 'dataset-rename');
    const name = element('input');
    name.required = true;
    name.maxLength = 160;
    name.value = dataset.name;
    const save = command('Сохранить название', 'submit');
    const status = statusLine();
    form.append(field('Название набора', name), save, status);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const nextName = name.value.trim();
      if (!nextName) {
        status.textContent = 'Введите название набора.';
        name.focus();
        return;
      }
      if (save.disabled) return;
      save.disabled = name.disabled = true;
      status.textContent = 'Сохранение…';
      try {
        const updated = await api(endpoint, {method: 'PATCH', json: {name: nextName}});
        name.value = updated.name;
        if (root.firstChild === panel) onRename?.(updated.name);
        status.textContent = 'Название сохранено.';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        save.disabled = name.disabled = false;
      }
    });
    panel.append(form);
  }

  if (!dataset.can_manage_access) return;
  const membersEndpoint = endpoint + '/members';
  const controls = element('fieldset', undefined, 'dataset-members');
  const heading = element('legend', 'Доступ к набору');
  const scope = element('select');
  for (const [value, label] of [['private', 'Только выбранные участники'], ['shared', 'Чтение всем в кабинете']]) {

function dateLabel(value) {

      return;
    }
    clearPhoto();
    selected = id;
    for (const [key, btn] of stationButtons) btn.setAttribute('aria-pressed', String(key === selected));
    spatial.select(station, notify);
    const info = el('div', 'atlas-info');
    const heading = el('div', 'atlas-identity');
    heading.append(el('h2', '', station.name || station.id));
    const code = station.code || station.id;
    if (code !== station.name) heading.append(el('span', 'atlas-id', code));
    info.append(heading);
    if (station.description) info.append(el('p', 'atlas-description', station.description));
    const location = hasPoint(station) ? [station.location_label, station.latitude.toFixed(4) + '°, ' + station.longitude.toFixed(4) + '°'].filter(Boolean).join(' · ') : station.location_label || 'Местоположение уточняется';
    info.append(el('p', 'atlas-location', location));
    const sets = station.datasets || [];
    const isReference = station.location_kind === 'reference';
    const facts = el('dl', 'atlas-facts');
    const starts = sets.map(d => d.start).filter(Boolean).sort();
    const ends = sets.map(d => d.end).filter(Boolean).sort();
    const rows = sets.reduce((sum, d) => sum + (Number(d.rows) || 0), 0);
    for (const [label, value] of [['Записи в наборах', numbers.format(rows)], ['Период наблюдений', period(starts[0], ends.at(-1))]]) {
      const fact = el('div');
      fact.append(el('dt', '', label), el('dd', '', value));
      facts.append(fact);
    }
    const related = el('section', 'atlas-related');
    const relatedHeading = el('div', 'atlas-related-heading');
    const publications = station.publications || [];
    relatedHeading.append(el('h3', '', isReference ? 'Опубликованные данные' : 'Наборы данных'), el('span', 'atlas-set-count', isReference ? publications.length : sets.length));
    related.append(relatedHeading);
    for (const d of sets) {
      const entry = button('atlas-dataset', '', () => onOpenDataset?.(d.id, station.id));
      const detail = el('span', 'atlas-dataset-text');
      detail.append(el('strong', '', datasetTitle(d, sets)));
      const sourceLabel = {station: 'Станционные наблюдения', stream: 'Поток наблюдений'}[d.source] || d.source;
      if (sourceLabel) detail.append(el('small', 'atlas-source', sourceLabel));
      detail.append(el('small', '', period(d.start, d.end) + ' · ' + counted(Number(d.rows) || 0, 'запись', 'записи', 'записей')));
      const arrow = el('span', 'atlas-open', '→');
      arrow.setAttribute('aria-hidden', 'true');
      entry.append(detail, arrow);
      related.append(entry);
    }
    if (isReference) {
      for (const publication of publications) {
        const link = externalLink(publication.url, 'atlas-dataset');
        if (!link) continue;
        const detail = el('span', 'atlas-dataset-text');
        detail.append(el('strong', '', publication.name), el('small', '', publication.period));
        link.append(detail, el('span', 'atlas-open', '↗'));
        related.append(link);
      }
      const passport = externalLink(station.source_url, 'atlas-passport');
      if (passport) {
        passport.textContent = 'Паспорт станции ↗';
        info.append(passport);
      }
    } else if (!sets.length) related.append(el('p', 'atlas-description', 'Нет доступных наборов для этой станции.'));
    dossier.replaceChildren(stationImage(station), info);
    if (!isReference || sets.length) dossier.append(facts);
    dossier.append(related);
    const eligible = sets.filter(d => d.can_upload_photo);
    if (onUploadPhoto && eligible.length) dossier.append(photoForm(station, eligible));
    if (notify) {
      onSelectStation?.(station.id);
      if (window.matchMedia('(max-width: 840px)').matches) dossier.scrollIntoView({block: 'start'});
    }
  }
  choose(stations.some(s => s.id === initialStation) ? initialStation : stations[0].id, false);
  return () => { spatial.dispose(); clearPhoto(); };
}

Object.assign(window,{mountStationAtlas});
})();
</script>

async function fetch(input, options={}) {
  const url=new URL(input,'https://preview.test');
  const path=decodeURI(url.pathname);
  const pieces=path.split('/');
  const method=options.method || 'GET';
  const ok=data=>Response.json(data);
  const id=pieces[3];
  const base='/api/datasets/'+id;
  const cards=[...fixtures['/api/catalog'],...fixtures['/api/datasets'],...fixtures['/api/stations'].flatMap(station=>station.datasets)].filter(card=>card.id===id);
  if(path.endsWith('/photo')) {
    if(method==='PUT') {
      photos.set(path,options.body);
      const station=fixtures['/api/stations'].find(row=>row.id===pieces[5]);
      const dataset=station.datasets.find(row=>row.id===id);
      dataset.photo_url = station.photo_url = path;
      dataset.photo_credit = station.photo_credit = url.searchParams.get('credit');
      return ok({});
    }
    return photos.has(path)?new Response(photos.get(path)):new Response(null,{status:404});
  }
  if(pieces[4]==='members' && pieces[5]) {
    const user=decodeURIComponent(pieces[5]);
    const acl=fixtures[base+'/members'];
    acl.members=acl.members.filter(x=>x.username!==user);
    if(method==='PUT') acl.members.push({username:user,role:JSON.parse(options.body).role});
    return new Response(null,{status:204});
  }
  if(path===base && method==='PATCH' && cards.length) {
    const name=JSON.parse(options.body).name.trim();
    for(const card of cards) card.name=name;
    return ok(cards[0]);
  }
  if(path===base+'/visibility' && method==='PUT') {
    const visibility=url.searchParams.get('shared')==='true'?'shared':'private';
    for(const card of cards) card.visibility=visibility;
    return ok({visibility});
  }
  if(path===base+'/connect' && method==='POST') return ok({connected:true});
  if(path==='/api/catalog') {
    const search=(url.searchParams.get('q')||'').toLocaleLowerCase('ru');
    return ok(fixtures[path].filter(item=>JSON.stringify(item).toLocaleLowerCase('ru').includes(search)));
  }
  if(path.endsWith('/series')) {
    const data=sampleSeries[[path,url.searchParams.get('station'),url.searchParams.get('step')].join('|')];
    return data ? ok(data) : Response.json({detail:'В демо доступны сутки и месяцы по датам карточки.'},{status:422});
  }
  if(path in fixtures) return ok(fixtures[path]);
  return Response.json({detail:'В демонстрационных данных доступна карта, каталог, участники и связанные наблюдения.'},{status:404});
}


const $ = (query, root = document) => root.querySelector(query);
const $$ = (query, root = document) => [...root.querySelectorAll(query)];
const content = $('#content');
const actions = $('#header-actions');
const notice = $('#notice');
const number = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2});
const escape = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[ch]);
const fmt = (value, unit = '') => value == null ? '—' : [number.format(value), unit].filter(Boolean).join(' ');
const query = (values) => new URLSearchParams(values).toString();
let token = sessionStorage.getItem('meteo-token') || '';
let account, dict, datasets, selectedDataset, page, currentSlice, drawChart, streamCursor = 0;
let atlasStationId, disposeStationAtlas;
const deepLink = new URLSearchParams('page=stations&station=KR1');
let columns = [['period', 'Период'], ['value', 'Значение'], ['coverage', 'Полнота'],
  ['deviation', 'Отклонение'], ['quality', 'Качество']];

async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  if (token) headers.set('Authorization', 'Bearer ' + token);
  if (options.json) headers.set('Content-Type', 'application/json');
  const response = await fetch(path, {...options, headers, body: options.json ? JSON.stringify(options.json) : options.body});
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(typeof body.detail === 'string' ? body.detail : 'Проверьте введённые значения.');
  }
  if (options.raw) return response;
  return response.status === 204 ? null : response.json();
}

function message(text = '') {
  notice.textContent = text;
  notice.hidden = !text;
}

function bind(node, event, handler) {
  node?.addEventListener(event, async (e) => {
    e.preventDefault();
    message();
    try { await handler(e); }
    catch (error) { message(error.message); }
  });
}

function options(entries, current) {
  return entries.map(([key, label]) => '<option value="' + escape(key) + '"' +
    (key === current ? ' selected' : '') + '>' + escape(label) + '</option>').join('');
}

async function signIn(value) {
  token = value;
  account = await api('/api/session');
  sessionStorage.setItem('meteo-token', token);
  dict = await api('/api/dictionary');
  const views = await api('/api/views');
  if (views.default?.length) columns = views.default;
  $('#login').hidden = $('#login-error').hidden = true;
  $('#workspace').hidden = $('#nav').hidden = $('#identity').hidden = false;
  $('#user-avatar').replaceChildren(humanAvatar(account.name));
  $('#user-name').textContent = account.name;
  $('#role').textContent = account.role === 'research' ? 'Исследователь' : 'Бизнес';
  $$('[data-research]').forEach(el => { el.hidden = account.role !== 'research'; });
  if (deepLink.get('page') === 'stations') {
    atlasStationId = deepLink.get('station');
    await navigate('stations');
  } else {
    await navigate('analysis');
  }
}

function signOut() {
  disposeStationAtlas?.();
  disposeStationAtlas = undefined;
  atlasStationId = selectedDataset = page = undefined;
  content.replaceChildren();
  token = '';
  sessionStorage.removeItem('meteo-token');
  $('#login').hidden = false;
  $('#workspace').hidden = $('#nav').hidden = $('#identity').hidden = true;
}

async function navigate(next, selection) {
  disposeStationAtlas?.();
  disposeStationAtlas = undefined;
  page = next;
  currentSlice = undefined;
  drawChart = undefined;
  message();
  actions.replaceChildren();
  content.innerHTML = '<p class="muted">Загрузка…</p>';
  $('#heading').textContent = {analysis: 'Наблюдения', stations: 'Карта станций', import: 'Импорт данных', catalog: 'Каталог наборов',
    reports: 'Отчёты', alerts: 'Уведомления', satellite: 'Спутниковые данные'}[page];
  $('#eyebrow').textContent = account.role === 'research' ? 'Кабинет исследователя' : 'Кабинет бизнеса';
  $$('nav button').forEach(el => { el.setAttribute('aria-current', el.dataset.page === page ? 'page' : 'false'); });
  await {analysis, stations: stationPage, import: importPage, catalog: catalogPage, reports: reportsPage, alerts: alertsPage, satellite: satellitePage}[page](selection);
}

async function stationPage() {
  // A detached host prevents a slower response from overwriting the next page or login.
  const host = document.createElement('div');
  host.textContent = 'Загрузка станций…';
  content.replaceChildren(host);
  const [local, references] = await Promise.all([api('/api/stations'), api('/api/stations/references')]);
  if (!host.isConnected) return;
  disposeStationAtlas = mountStationAtlas(host, [...local, ...references], {
    initialStation: atlasStationId,
    onSelectStation: id => { atlasStationId = id; },
    onOpenDataset(dataset, station) {
      atlasStationId = station;
      navigate('analysis', {dataset, station}).catch(error => message(error.message));
    },
    async loadPhoto(path, options) {
      const url = new URL(path, 'https://preview.test');
      if (url.origin !== 'https://preview.test' || !url.pathname.startsWith('/api/datasets/')) {
        throw new Error('Недоступный адрес фотографии.');
      }
      const result = await api(url.pathname, {...options, raw: true, redirect: 'error'});
      return result.blob();
    },
    async onUploadPhoto(dataset, station, file, credit) {
      atlasStationId = station;
      const path = '/api/datasets/' + encodeURIComponent(dataset) + '/stations/' +
        encodeURIComponent(station) + '/photo?' + query({credit});
      await api(path, {method: 'PUT', headers: {'Content-Type': file.type}, body: file, raw: true});
      if (host.isConnected) await navigate('stations');
    },
  });
}

async function analysis(selection) {
  const initialFilters = selection ? new URLSearchParams(selection) : deepLink;
  const activeAccount = account;
  const available = await api('/api/datasets');
  if (page !== 'analysis' || activeAccount !== account) return;
  datasets = available;
  if (!datasets.length) {
    content.innerHTML = '<section class="panel"><h2>Нет доступных наборов</h2><p>Откройте каталог или загрузите файл в кабинете исследователя.</p></section>';
    return;
  }
  selectedDataset = datasets.find(entry => entry.id === (selection?.dataset || selectedDataset || initialFilters.get('dataset')))?.id || datasets[0].id;
  content.innerHTML = `<form class="panel" id="filter-form"><div class="filters">
    <label class="wide">Набор<select name="dataset">${options(datasets.map(d => [d.id, d.name]), selectedDataset)}</select></label>

    <label>Параметр<select name="parameter"></select></label>
    <label>С начала<input name="start" required type="date"></label>
    <label>По конец<input name="end" required type="date"></label>
    <label>Агрегация<select name="step">${options(Object.entries(dict.periods), initialFilters.get('step') || 'month')}</select></label>
  </div><div class="actions"><button class="primary">Показать</button><span id="examples"></span></div></form>
  <div id="slice"></div>`;
  const form = $('#filter-form');
  function setRange() {
    const dataset = datasets.find(item => item.id === form.elements.dataset.value);
    const station = dataset.stations.find(item => item.station === form.station.value);
    if (!station) return;
    form.start.value = station.start.slice(0, 10);
    form.end.value = station.end.slice(0, 10);
    if (['KR1', 'KR2'].includes(station.station) && dataset.metadata.territory === 'Урочище Красное' &&
        form.start.value <= '2024-04-01' && form.end.value >= '2024-04-30') {
      form.start.value = '2024-04-01'; form.end.value = '2024-04-30';
    }
    if (dataset.source === 'stream' && !initialFilters.get('step')) form.step.value = 'instant';
  }
  function setData() {
    selectedDataset = form.elements.dataset.value;
    const dataset = datasets.find(item => item.id === selectedDataset);

    form.parameter.innerHTML = options(dataset.parameters.map(key => [key, dict.parameters[key].name]),
      initialFilters.get('parameter') || 't_air');
    setRange();
  }
  // Keep access to dataset explicit since HTMLElement.dataset also exists on the form.
  const setSelection = (station, parameter, start, end) => {
    form.station.value = station; form.parameter.value = parameter;
    form.start.value = start; form.end.value = end; form.step.value = 'month';
  };
  const run = async () => {
    const filters = Object.fromEntries(new FormData(form));
    const version = filters.dataset; delete filters.dataset;
    const results = await api('/api/datasets/' + version + '/series?' + query(filters));
    if (page !== 'analysis' || form !== $('#filter-form')) return;
    currentSlice = {version, filters, results};
    renderSlice(results);
  };
  setData();
  if (initialFilters.get('start') && initialFilters.get('end')) {
    form.start.value = initialFilters.get('start'); form.end.value = initialFilters.get('end');
  }
  if (datasets.some(d => d.stations.some(s => s.station === 'AME60') && d.stations.some(s => s.station === 'KR1'))) {
    $('#examples').innerHTML = '<button type="button" id="january">Январь АМЕ‑60</button> <button type="button" id="pressure">Давление Кр1</button>';
    const reserve = datasets.find(d => d.stations.some(s => s.station === 'AME60') && d.stations.some(s => s.station === 'KR1'));
    const example = async (args) => {
      form.elements.dataset.value = reserve.id; setData(); setSelection(...args); await run();
    };
    bind($('#january'), 'click', () => example(['AME60', 't_air', '1992-01-01', '2021-12-31']));
    bind($('#pressure'), 'click', () => example(['KR1', 'pressure_hpa', '2024-04-01', '2024-04-30']));
  }
  bind(form, 'submit', run);
  bind(form.elements.dataset, 'change', async () => { setData(); await run(); });
  bind(form.station, 'change', setRange);
  await run();
  if (initialFilters.get('day') && page === 'analysis') await loadQuality(initialFilters.get('day'));
}

const showCoverage = (row) => row.valid_days + ' / ' + row.expected_days + ' сут.';
const issue = (row) => row.partial ? 'Часть календарного периода' :
  row.reason ? (dict.flags[row.reason] || row.reason) : 'Пригоден';
const qcLink = row => '<button class="text" data-quality="' + escape(row.start.slice(0, 10)) + '">' + escape(row.start) +
  (row.start === row.end ? '' : ' — ' + escape(row.end)) + '</button>';

function table(data, configurable = false) {
  const available = {
    period: qcLink, value: row => fmt(row.value, data.unit),
    coverage: showCoverage, deviation: row => fmt(row.deviation, data.unit), quality: issue,
    gaps: row => row.longest_gap + ' сут.',
  };
  const shown = configurable ? columns : columns.filter(([key]) => key !== 'quality');
  return '<div class="table-wrap"><table><thead><tr>' + shown.map(([, label]) => '<th scope="col">' + escape(label) +
    '</th>').join('') + '</tr></thead><tbody>' + data.points.map(row => '<tr>' + shown.map(([key]) => '<td>' +
    (key === 'period' ? available[key](row) : escape(available[key]?.(row))) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
}

function displayChart(canvas, points) {
  const context = canvas.getContext('2d');
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  const ratio = devicePixelRatio || 1;
  canvas.width = width * ratio; canvas.height = height * ratio;
  context.scale(ratio, ratio);
  const values = points.filter(row => row.value !== null).map(row => row.value);
  const min = values.length ? Math.min(...values) : 0;
  const span = values.length ? Math.max(Math.max(...values) - min, 1) : 1;
  const left = 49, right = width - 15, top = 10, bottom = height - 36;
  const x = i => points.length === 1 ? (left + right) / 2 : left + i * (right - left) / Math.max(1, points.length - 1);
  const y = value => bottom - (value - min) * (bottom - top - 10) / span;
  context.font = '12px system-ui'; context.textAlign = 'right';
  for (let index = 0; index <= 4; index++) {
    const value = min + span * index / 4;
    const lineY = y(value);
    context.strokeStyle = '#d8e1d7'; context.lineWidth = 1; context.beginPath(); context.moveTo(left, lineY);
    context.lineTo(right, lineY); context.stroke();
    context.fillStyle = '#526761'; context.fillText(fmt(value), left - 8, lineY + 3);
  }
  context.strokeStyle = '#23634f'; context.lineWidth = 2; context.beginPath();
  let open = false;
  points.forEach((row, index) => {
    if (row.value === null) { open = false; return; }
    context[open ? 'lineTo' : 'moveTo'](x(index), y(row.value));
    open = true;
  });
  context.stroke();
  if (points.length <= 42) {
    context.fillStyle = '#23634f';
    points.forEach((row, index) => {
      if (row.value === null) return;
      context.beginPath(); context.arc(x(index), y(row.value), 3.1, 0, Math.PI * 2); context.fill();
    });
  }
  if (points.length) {
    context.fillStyle = '#526761'; context.textAlign = 'left'; context.fillText(points[0].start, left, height - 11);
    if (points.length > 1) {
      context.textAlign = 'right'; context.fillText(points.at(-1).end, right, height - 11);
    }
  }
  if (!values.length) {
    context.textAlign = 'center'; context.fillText('За этот период значения исключены правилами качества', width / 2, height / 2);
  }
  canvas.onclick = (event) => {
    if (!points.length || page !== 'analysis') return;
    const index = Math.max(0, Math.min(points.length - 1,
      Math.round((event.offsetX - left) * (points.length - 1) / Math.max(1, right - left))));
    loadQuality(points[index].start.slice(0, 10)).catch(error => message(error.message));
  };
}

async function loadQuality(day) {
  if (!currentSlice) return;
  const {version, filters, results} = currentSlice;
  const row = results.points.find(point => point.start === day);
  const response = await api('/api/datasets/' + version + '/quality?' +
    query({station: filters.station, parameter: filters.parameter, day}));
  const panel = $('#quality');
  if (!panel) return;
  panel.innerHTML = `<h2>Контроль качества</h2>
    ${row ? '<p>' + showCoverage(row) + ' · серия до ' + row.longest_gap + ' сут.</p>' : ''}
    <label>Дата исходных наблюдений<input type="date" id="quality-date" value="${escape(day)}"></label>
    <p>${response.day.valid_slots} / ${response.day.expected_slots} ${escape(response.day.slot_unit)} · минимум ${response.day.minimum_slots}</p>
    <p class="muted">${escape(dict.flags[response.day.reason] || 'Достаточное покрытие')}</p>
    <p>${escape(Object.entries(row?.flags || response.day.flags).map(([key, count]) => key + ': ' + count).join(' · '))}</p>
    <div class="table-wrap"><table><thead><tr><th>Время / источник</th><th>Значение / QC</th></tr></thead><tbody>
    ${response.rows.map(r => '<tr><td>' + escape(r.original_stamp) + '<br><small>' + escape(r.source_file) + ':' +
      r.source_row + ' · ' + escape(r.zone === 'unknown' ? 'пояс неизвестен' : r.zone) + '</small></td><td>' +
      fmt(r.value, results.unit) + '<br><small>' + (r.received_at ? 'Принято: ' + escape(r.received_at) + '<br>' : '') + escape(r.reasons.map(v => v.label).join(', ')) + '</small></td></tr>').join('')}
    </tbody></table></div>`;
  bind($('#quality-date'), 'change', e => loadQuality(e.currentTarget.value));
}

async function download(kind, format) {
  const {version, filters} = currentSlice;
  const suffix = format ? '?' + query({...filters, format}) : '';
  const response = await api('/api/datasets/' + version + '/' + kind + suffix, {raw: true});
  const blob = URL.createObjectURL(await response.blob());
  const anchor = document.createElement('a');
  anchor.href = blob;
  anchor.download = format ? 'meteo.' + format : response.headers.get('Content-Disposition')?.match(/filename="([^"]+)"/)?.[1] || 'source';
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(blob), 500);
}

        <label class="check"><input type="checkbox" name="${index}-skip">Пропустить таблицу</label></div>

        Object.entries(saved.mapping || {}).forEach(([key, value]) => {
          const select = form.elements[i + '-map-' + key];

      message('Импорт выполняется…');
      try {
        const config = Object.fromEntries(tables.map((tab, index) => {
          const mapping = Object.fromEntries(dict.fields.flatMap(key => {
            const value = data.get(index + '-map-' + key);

          return [tab.name, {mapping, station: data.get(index + '-station'), skip: data.has(index + '-skip')}];
        }));
        const result = await api('/api/imports/' + hash, {method: 'POST', json: {options: config,
          name: data.get('dataset-title') || null, template: data.get('template') || null}});
        selectedDataset = result.id;

}

async function reportsPage() {
  const reports = await api('/api/reports');
  content.innerHTML = `<section class="panel no-print"><h2>Сохранённые отчёты</h2>
    ${reports.map(r => '<p><button class="text" data-report="' + escape(r.id) + '">' + escape(r.title) +
      '</button> · <small>' + escape(r.created_at) + '</small></p>').join('') ||
      '<p>Выберите срез в наблюдениях и нажмите «Создать отчёт».</p>'}</section><div id="report"></div>`;
  $$('[data-report]').forEach(button => bind(button, 'click', async () => renderReport(await api('/api/reports/' + button.dataset.report))));
}

function renderReport(data) {
  actions.innerHTML = '<button id="print" class="primary">Печать</button>';
  bind($('#print'), 'click', () => window.print());
  $('#report').innerHTML = `<section class="panel"><h2>${escape(data.title)}</h2>
    <p>${escape(data.template)} · ${escape(data.name)} · ${escape(dict.stations[data.station] || data.station)}</p>
    <p>${escape(data.start)} — ${escape(data.end)} · ${escape(data.unit)} · ${escape(dict.periods[data.step])}</p>
    <p>Среднее по доступным агрегатам <strong>${fmt(data.summary.average, data.unit)}</strong> · пригодных суток
    ${data.coverage.valid_days} из ${data.coverage.days}.</p>
    <p class="break">Источник ${escape(data.metadata?.provider || data.source)} · версия <code>${escape(data.dataset)}</code></p>
    <p>${escape(data.method)} · QC ${escape(data.qc)}. Пропуски остаются пустыми.</p>
    <canvas class="chart" aria-label="График отчёта"></canvas>${table(data).replaceAll(/<button class="text" data-quality="[^"]*">/g, '<span>').replaceAll('</button>', '</span>')}</section>`;
  const canvas = $('.chart', $('#report'));
  drawChart = () => displayChart(canvas, data.points); drawChart();
}

async function alertsPage() {
  const data = await api('/api/alerts');
  const events = {active: 'Порог превышен', recovered: 'Восстановление', stale: 'Данные устарели', insufficient: 'Недостаточно данных', normal: 'В норме'};
  content.innerHTML = `<section class="panel"><h2>Состояние потока</h2>
    <p>${data.feed ? 'Последний приём: ' + escape(data.feed.last_received) + ' · ' + escape(data.feed.mode) : 'Поток ещё не поступал.'}</p>
    <p>${data.rules.map(rule => escape(rule.body.name) + ' · ' + escape(events[rule.state] || rule.state)).join('<br>') || 'Нет правил для кабинета.'}</p>
    <button id="refresh">Обновить</button> ${data.demo && account.role === 'research' ? '<button class="primary" id="replay">Воспроизвести архив</button>' : ''}
    ${account.role === 'research' ? `<details><summary>Создать правило</summary><form id="rule-form" class="filters">
      <label>Название<input name="name" required value="Высокая температура"></label>
      <label>Станция<input name="station" required value="KR1"></label>
      <label>Параметр<select name="parameter">${options(Object.entries(dict.parameters).map(([k, v]) => [k,v.name]), 't_air')}</select></label>
      <label>Порог ≥<input name="threshold" type="number" step="any" required value="20"></label>
      <label>Длительность, мин<input name="minutes" type="number" min="0" required value="30"></label>
      <label>Покрытие от 0 до 1<input name="coverage" type="number" step=".01" min=".01" max="1" value=".75" required></label>
      <label>Получатель<input name="recipient" required value="business"></label>
      <label>Устаревание, мин<input name="stale_minutes" type="number" min="1" value="30" required></label>
      <button class="primary">Сохранить</button></form></details>` : ''}</section>
    <section class="panel"><h2>История событий</h2>${data.events.map(event => '<p><span class="tag warn">' +
      escape(events[event.state] || event.state) + '</span> ' + escape(event.body.name) + ' · ' + escape(event.happened_at) +
      ' · ' + fmt(event.body.value, event.body.unit) + ' · ' + escape(event.delivery) +
      (event.body.url ? ' · <a href="' + escape(event.body.url) + '">График</a>' : '') + '</p>').join('') ||
      '<p>Событий пока нет.</p>'}</section>`;
  bind($('#refresh'), 'click', alertsPage);
  bind($('#rule-form'), 'submit', async event => {
    await api('/api/alerts/rules', {method: 'POST', json: Object.fromEntries(new FormData(event.currentTarget))}); await alertsPage();
  });
  bind($('#replay'), 'click', async () => {
    const result = await api('/api/demo/replay', {method: 'POST', json: {cursor: streamCursor}});
    streamCursor = result.next_cursor;
    await alertsPage(); message('Принято: ' + result.accepted + ' · события: ' + result.events + ' · ' + result.elapsed_ms + ' мс');
  });
}

bind($('#login-form'), 'submit', e => signIn(e.currentTarget.token.value).catch(error => {
  $('#login-error').textContent = error.message; $('#login-error').hidden = false;
}));
$$('[data-token]').forEach(button => bind(button, 'click', () => signIn(button.dataset.token).catch(error => {
  $('#login-error').textContent = error.message; $('#login-error').hidden = false;
})));
bind($('#logout'), 'click', signOut);
$$('nav button').forEach(button => bind(button, 'click', () => navigate(button.dataset.page)));
window.addEventListener('resize', () => drawChart?.());
api('/health').then(config => {
  $('#demo-logins').hidden = !config.demo;
  if (!token) { signOut(); return; }
  signIn(token).catch(signOut);
}).catch(signOut);

let satelliteDate = '';
let satelliteRefresh;
async function satellitePage() {
  const config = await api('/api/satellite');
  const yesterday = new Date(Date.parse(config.today) - 86400000).toISOString().slice(0, 10);
  content.innerHTML = `<form class="panel" id="satellite-form"><div class="filters">
    <label class="wide">Область<select name="area">${options(Object.entries(config.areas).map(([k, v]) => [k, v.name]), 'reserve')}</select></label>
    <label class="wide">Слой<select name="layer">${options(Object.entries(config.layers).map(([k, v]) => [k, v.name]), 'truecolor')}</select></label>
    <label>Дата UTC<input name="day" type="date" required max="${escape(config.today)}" min="2012-01-01"
     value="${escape(satelliteDate >= '2012-01-01' && satelliteDate <= config.today ? satelliteDate : config.today)}"></label>
    <button class="primary">Обновить</button></div><div class="actions">
      <button type="button" id="sat-today">Сегодня UTC</button><button type="button" id="sat-yesterday">Вчера UTC</button>
      <label class="check"><input type="checkbox" name="auto" checked>Обновлять каждые 5 минут</label>
    </div></form><div id="satellite-result"></div>`;
  const form = $('#satellite-form');
  const render = async () => {
    if (page !== 'satellite' || form !== $('#satellite-form')) return;
    const fields = Object.fromEntries(new FormData(form));
    delete fields.auto;
    const data = await api('/api/satellite/imagery?' + query(fields));
    if (page !== 'satellite' || form !== $('#satellite-form')) return;
    $('#satellite-result').innerHTML = `<div class="layout"><section class="panel"><h2>${escape(data.area)}</h2>
      <p>${escape(data.product.name)} · ${escape(data.date)} UTC · ${escape(data.product.cadence)}</p>
      <img class="satellite-image" src="${escape(data.image_url)}" alt="${escape(data.product.name)} над выбранной областью"
        referrerpolicy="no-referrer">
      <p class="muted" id="sat-image-status" role="status">Получаем слой NASA GIBS…</p>
      <div class="actions"><a class="button" href="${escape(data.worldview)}" target="_blank" rel="noopener">Открыть в NASA Worldview</a>
        <a class="button" href="${escape(data.firms)}" target="_blank" rel="noopener">NASA FIRMS</a></div>
      <small>${escape(data.attribution)} · границы области приблизительные</small>
    </section><section class="panel"><h2>Обработанные продукты</h2><p>${escape(data.product.description)}</p>
      <p class="muted">Первичные наборы и поиск файлов по области и дате. Для части продуктов нужна учётная запись поставщика.</p>
      ${data.reference_products.map(item => `<article><h3>${escape(item.name)}</h3><p>${escape(item.resolution)}</p>
        <div class="actions"><a href="${escape(item.url)}" target="_blank" rel="noopener">Описание</a>
        ${item.granules ? '<a href="' + escape(item.granules) + '" target="_blank" rel="noopener">Файлы по области (JSON)</a>' : ''}</div></article>`).join('')}
    </section></div>`;
    const image = $('.satellite-image');
    const status = $('#sat-image-status');
    const loaded = () => { status.textContent = 'Дата слоя указана в UTC. Пустые пиксели возможны при облачности или отсутствии пролёта.'; };
    const failed = () => {
      image.hidden = true;
      status.textContent = 'Снимок не загрузился. Проверьте соседнюю дату или откройте NASA Worldview.';
    };
    image.addEventListener('load', loaded, {once: true});
    image.addEventListener('error', failed, {once: true});
    if (image.complete) (image.naturalWidth ? loaded : failed)();
  };
  bind(form, 'submit', render);
  bind($('#sat-today'), 'click', () => { form.day.value = new Date().toISOString().slice(0, 10); return render(); });
  bind($('#sat-yesterday'), 'click', () => { form.day.value = yesterday; return render(); });
  for (const name of ['area', 'layer', 'day']) bind(form.elements[name], 'change', render);
  clearInterval(satelliteRefresh);
  satelliteRefresh = setInterval(() => {
    if (page !== 'satellite') { clearInterval(satelliteRefresh); return; }
    if (form.auto.checked) render().catch(error => message(error.message));
  }, 5 * 60 * 1000);
  await render();
}

})();
</script>
</body>
