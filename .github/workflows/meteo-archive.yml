name: Weather portal checks

on:
  push:
    paths: [meteo-archive/**, .github/workflows/meteo-archive.yml]
  pull_request:
    paths: [meteo-archive/**, .github/workflows/meteo-archive.yml]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: meteo-archive
    env:
      METEO_ARCHIVE: ${{ github.workspace }}/data/raw/meteo_hack_dataset.zip
      METEO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meteo-archive/portal/requirements.txt
      - run: python -m pip install -r portal/requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python scripts/install_dashboard_assets.py
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test catalog
      - run: python -m unittest discover -s tests -v
