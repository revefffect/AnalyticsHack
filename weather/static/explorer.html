<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143a30"><title>Показатели станций · Урочище Красное</title>
  <link rel="stylesheet" href="/portal/static/portal.css"><link rel="stylesheet" href="/portal/static/guest.css?v=2">
  <link rel="stylesheet" href="/portal/static/explorer.css">
  <script type="module" src="/portal/static/explorer.js"></script>
</head><body>
  <a class="skip" href="#content">К содержанию</a>
  <header class="mast"><div class="mast-inner"><a class="brand guest-brand" href="/portal"><i class="brand-mark" aria-hidden="true"></i><span>Красное<small>Метеонаблюдения</small></span></a>
    <a class="action-link" href="/portal?demo=atlas">Атлас станций</a></div></header>
  <main class="shell" id="content">
    <header class="workspace-heading landscape"><div><p class="intro-location">Центрально-Лесной заповедник · урочище Красное</p>
      <h1>Показатели станций</h1></div><div class="isobars" aria-hidden="true"></div></header>
    <p id="message" role="status">Загружаем архив наблюдений…</p>
    <section id="explorer" class="card guest-section" aria-label="Статистика наблюдений" hidden>
      <div class="explore-filters">
        <label>Станция<select id="site"></select></label>
        <label>Показатель<select id="metric"></select></label>
        <label>Год<select id="year"></select></label>
        <label>Месяц<select id="month"></select></label>
      </div>
      <h2 id="heading"></h2>
      <dl id="stats-values" aria-live="polite"></dl>
      <p id="method"></p>
      <iframe id="graph" title="График наблюдений в Grafana"></iframe>
      <a id="standalone" class="action-link" target="_blank" rel="noopener">Открыть график в Grafana ↗</a>
    </section>
  </main>
</body></html>
