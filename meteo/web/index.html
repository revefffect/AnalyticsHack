<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112b2a">
  <title>Метеоархив · AnalyticsHack</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/station-atlas.css">
  <link rel="stylesheet" href="/assets/dataset-access.css">
  <link rel="stylesheet" href="/assets/workspace-shell.css">
  <link rel="stylesheet" href="/assets/ui-primitives.css">
  <link rel="stylesheet" href="/assets/form-controls.css">
  <link rel="stylesheet" href="/assets/analytics-workspace.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <aside class="sidebar" id="workspace-sidebar" aria-label="Навигация Метеоархива">
    <div class="brand-row">
      <button type="button" class="icon-button menu-toggle" aria-label="Меню разделов" aria-controls="nav" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
      <a class="brand" href="/">Метеоархив<span class="brand-dot" aria-hidden="true"></span></a>
    </div>
    <nav id="nav" aria-label="Разделы" hidden>
      <button type="button" data-page="import" data-research class="workspace-create"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Загрузить данные</span></button>
      <button type="button" data-page="stations"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 5.5-2 7 2.5 5.5-2V19l-5.5 2-7-2.5L3 20.5Z"/><path d="M8.5 3v15.5M15.5 5.5V21"/></svg><span>Станции</span></button>
      <button type="button" data-page="analysis"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3.5v17h17M6.5 14l4-4 3 2.5 6-7"/></svg><span>Наблюдения</span></button>
      <button type="button" data-page="catalog"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></svg><span>Каталог наборов</span></button>
      <button type="button" data-page="satellite"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 12 3-3 3 3-3 3zM4 7l3-3 3 3-3 3zM14 17l3-3 3 3-3 3zM4 13a7 7 0 0 0 7 7M4 17a3 3 0 0 0 3 3"/></svg><span>Спутник</span></button>
      <button type="button" data-page="reports"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg><span>Отчёты</span></button>
      <button type="button" data-page="alerts"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 20a2.5 2.5 0 0 0 4 0"/></svg><span>Уведомления</span></button>
    </nav>
  </aside>
  <div class="workspace-column">
    <div class="workspace-toolbar" id="workspace-toolbar" hidden>
      <form class="global-search" role="search" id="workspace-search-form"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15 15 5 5"/></svg>
        <input type="search" id="workspace-search" placeholder="Найти станцию или связанный набор" aria-label="Найти станцию или связанный набор" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </form>
      <div class="toolbar-end">
        <label class="theme-control" title="Цветовая тема"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16Z" fill="currentColor" stroke="none"/></svg>
          <select id="workspace-theme" aria-label="Цветовая тема"><option value="forest">Лесная</option><option value="ink">Графит</option><option value="violet">Аметист</option></select>
        </label>
        <div class="identity" id="identity" hidden><div class="account-profile"><span id="user-avatar"></span><span><strong id="user-name"></strong><small id="role"></small></span></div><button type="button" class="icon-button" id="logout" title="Выйти" aria-label="Выйти"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5H5v14h6M10 12h11m-4-4 4 4-4 4"/></svg></button></div>
      </div>
    </div>
    <main id="main">
    <section id="login" class="login" hidden>
      <p class="eyebrow">Центрально-Лесной заповедник</p>
      <h1>Метеоархив</h1>
      <p>Наблюдения, проверка качества и отчёты по урочищу Красное.</p>
      <form id="login-form">
        <label>Ключ кабинета<input name="token" type="password" required autocomplete="current-password"></label>
        <button class="primary">Войти</button>
      </form>
      <div id="demo-logins" class="actions" hidden>
        <button data-token="research-demo">Кабинет исследователя</button>
        <button data-token="business-demo">Кабинет бизнеса</button>
      </div>
    </section>
    <section id="workspace" hidden>
      <header class="page-head">
        <div><p class="eyebrow" id="eyebrow"></p><h1 id="heading"></h1></div>
        <div class="actions" id="header-actions"></div>
      </header>
      <p id="notice" role="status" hidden></p>
      <div id="content"></div>
    </section>
    <p id="login-error" role="alert" hidden></p>
    </main>
  </div>
</body>
</html>
